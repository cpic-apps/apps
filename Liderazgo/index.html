<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liderazgo Lateral &amp; Influencia Sin Autoridad</title>
<style>
:root{
  --bg-deep:#0f172a;
  --bg-panel:#1e293b;
  --bg-panel-2:#243146;
  --indigo:#6366f1;
  --indigo-light:#818cf8;
  --emerald:#10b981;
  --amber:#f59e0b;
  --text-hi:#f1f5f9;
  --text-mid:#cbd5e1;
  --text-low:#94a3b8;
  --border:#334155;
  --danger:#f87171;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
  --shadow-1:0 2px 8px rgba(0,0,0,.25);
  --shadow-2:0 12px 32px rgba(0,0,0,.35);
  --sidebar-w:280px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:radial-gradient(1200px 800px at 10% -10%, #17203a 0%, var(--bg-deep) 55%);
  color:var(--text-hi);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--indigo);color:#fff;}

/* ---------- Layout shell ---------- */
.app-shell{display:flex;min-height:100vh;}

.topbar{
  display:none;
  position:sticky;top:0;z-index:40;
  align-items:center;justify-content:space-between;
  padding:14px 16px;
  background:rgba(15,23,42,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;}
.topbar-brand .logo-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--emerald));box-shadow:0 0 12px var(--indigo);}
.hamburger{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-panel);display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.hamburger span{display:block;width:18px;height:2px;background:var(--text-hi);position:relative;}
.hamburger span::before,.hamburger span::after{content:'';position:absolute;left:0;width:18px;height:2px;background:var(--text-hi);}
.hamburger span::before{top:-6px;}
.hamburger span::after{top:6px;}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg,var(--bg-panel) 0%, #172236 100%);
  border-right:1px solid var(--border);
  padding:26px 20px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:26px;
  z-index:35;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 4px;}
.brand .logo-dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--emerald));box-shadow:0 0 16px var(--indigo);}
.brand-text{line-height:1.15;}
.brand-text b{font-size:15px;letter-spacing:.2px;}
.brand-text span{display:block;font-size:11px;color:var(--text-low);text-transform:uppercase;letter-spacing:.12em;margin-top:2px;}

.org-badge{
  display:flex;align-items:center;justify-content:center;
  background:#ffffff;border-radius:var(--radius-md);
  padding:12px 14px;box-shadow:var(--shadow-1);
}
.org-badge img{width:100%;max-width:190px;height:auto;display:block;}
.topbar-org-badge{
  background:#ffffff;border-radius:8px;padding:5px 9px;display:flex;align-items:center;
}
.topbar-org-badge img{height:26px;width:auto;display:block;}
.module-org-mark{
  display:flex;align-items:center;gap:8px;margin-bottom:16px;
}
.module-org-mark img{height:34px;width:auto;display:block;background:#fff;border-radius:6px;padding:4px 6px;}

.progress-wrap{padding:14px;background:var(--bg-panel-2);border-radius:var(--radius-md);border:1px solid var(--border);}
.progress-wrap .pw-head{display:flex;justify-content:space-between;font-size:12px;color:var(--text-low);margin-bottom:8px;}
.progress-wrap .pw-head b{color:var(--text-hi);font-size:13px;}
.progress-track{height:8px;border-radius:99px;background:#0b1324;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--indigo),var(--emerald));transition:width .5s cubic-bezier(.4,0,.2,1);}

.nav-list{display:flex;flex-direction:column;gap:6px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 12px;border-radius:var(--radius-sm);
  cursor:pointer;border:1px solid transparent;
  transition:background .15s, border-color .15s, transform .1s;
  position:relative;
}
.nav-item:hover{background:rgba(99,102,241,.1);}
.nav-item.active{background:rgba(99,102,241,.16);border-color:rgba(99,102,241,.4);}
.nav-item.locked{opacity:.45;cursor:not-allowed;}
.nav-badge{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
  background:#0b1324;border:1px solid var(--border);color:var(--text-mid);
}
.nav-item.active .nav-badge{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.nav-item.done .nav-badge{background:var(--emerald);border-color:var(--emerald);color:#03150f;}
.nav-labels{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0;}
.nav-labels b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-labels span{font-size:11px;color:var(--text-low);}
.nav-lock{font-size:14px;color:var(--text-low);}

.sidebar-foot{display:flex;flex-direction:column;gap:10px;}
.btn{
  border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:transform .12s, box-shadow .12s, background .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--indigo),#4f46e5);color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35);}
.btn-primary:hover{box-shadow:0 8px 22px rgba(99,102,241,.5);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-mid);}
.btn-ghost:hover{border-color:var(--danger);color:var(--danger);}
.btn-amber{background:linear-gradient(135deg,var(--amber),#d97706);color:#1c1206;}
.btn-emerald{background:linear-gradient(135deg,var(--emerald),#059669);color:#02150e;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-full{width:100%;}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}

.overlay{
  display:none;position:fixed;inset:0;background:rgba(3,7,18,.6);backdrop-filter:blur(2px);z-index:30;
}

/* ---------- Main content ---------- */
.main{flex:1;min-width:0;padding:36px 40px 80px;max-width:980px;margin:0 auto;width:100%;}
.module-header{margin-bottom:28px;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--indigo-light);background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);
  padding:6px 12px;border-radius:99px;margin-bottom:14px;
}
.module-title{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;margin:0 0 10px;}
.module-sub{font-size:15px;color:var(--text-mid);line-height:1.6;max-width:640px;}

.card{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:26px;margin-bottom:22px;box-shadow:var(--shadow-1);
}
.card h3{margin:0 0 14px;font-size:18px;font-weight:750;letter-spacing:-.01em;}
.card h4{margin:18px 0 8px;font-size:14.5px;font-weight:700;color:var(--indigo-light);}
.card p{color:var(--text-mid);line-height:1.7;font-size:14.5px;margin:0 0 12px;}
.section-tag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--emerald);margin-bottom:8px;
}

/* Tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:18px;padding-bottom:0;}
.tab-btn{
  background:none;border:none;color:var(--text-low);padding:10px 16px;font-size:13.5px;font-weight:600;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;
}
.tab-btn:hover{color:var(--text-hi);}
.tab-btn.active{color:var(--indigo-light);border-color:var(--indigo);}
.tab-panel{display:none;animation:fadeIn .25s ease;}
.tab-panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* Accordion */
.accordion-item{border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden;background:var(--bg-panel-2);}
.accordion-head{
  display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;
  font-weight:650;font-size:14.5px;
}
.accordion-head:hover{background:rgba(99,102,241,.08);}
.accordion-icon{transition:transform .25s;color:var(--indigo-light);font-size:16px;}
.accordion-item.open .accordion-icon{transform:rotate(45deg);}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px;}
.accordion-item.open .accordion-body{padding:0 18px 16px;}
.accordion-body p{margin:0;color:var(--text-mid);font-size:14px;line-height:1.7;}
.accordion-body ul{margin:8px 0 0;padding-left:18px;color:var(--text-mid);font-size:14px;line-height:1.8;}

/* Flip cards */
.flip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
.flip-card{perspective:1000px;height:180px;cursor:pointer;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius-md);
  padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;
  border:1px solid var(--border);
}
.flip-front{background:linear-gradient(150deg,var(--bg-panel-2),var(--bg-panel));}
.flip-front .fc-icon{font-size:28px;}
.flip-front b{font-size:14px;}
.flip-back{background:linear-gradient(150deg,#312e81,#1e1b4b);transform:rotateY(180deg);font-size:12.5px;color:#e0e7ff;line-height:1.6;}

/* Case study */
.case-box{
  background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(16,185,129,.05));
  border:1px solid rgba(99,102,241,.25);border-radius:var(--radius-md);padding:20px;margin-top:8px;
}
.case-box .case-label{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin-bottom:10px;}

/* Tool blocks */
.tool-block{border:1px dashed var(--border);border-radius:var(--radius-md);padding:20px;margin-top:10px;background:#111a2e;}
.field-row{margin-bottom:16px;}
.field-row label{display:block;font-size:13px;font-weight:600;color:var(--text-mid);margin-bottom:6px;}
input[type=text],input[type=number],textarea,select{
  width:100%;background:#0b1324;border:1px solid var(--border);border-radius:9px;padding:10px 12px;
  color:var(--text-hi);font-size:13.5px;font-family:inherit;resize:vertical;
}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
input[type=range]{width:100%;accent-color:var(--indigo);}
.slider-value{font-size:12px;color:var(--indigo-light);font-weight:700;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-row .bar-label{width:120px;font-size:12.5px;color:var(--text-mid);flex-shrink:0;}
.bar-track{flex:1;height:12px;border-radius:99px;background:#0b1324;overflow:hidden;border:1px solid var(--border);}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--indigo),var(--emerald));transition:width .5s ease;}
.bar-num{width:34px;text-align:right;font-size:12.5px;font-weight:700;color:var(--text-hi);}

.chip-grid{display:flex;flex-wrap:wrap;gap:10px;}
.chip{
  padding:10px 14px;border-radius:99px;border:1px solid var(--border);background:#0b1324;
  font-size:13px;cursor:pointer;transition:all .15s;color:var(--text-mid);
}
.chip:hover{border-color:var(--indigo);}
.chip.sel-influence{background:rgba(16,185,129,.18);border-color:var(--emerald);color:#d1fae5;}
.chip.sel-concern{background:rgba(245,158,11,.18);border-color:var(--amber);color:#fef3c7;}
.circle-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
.circle-col{border-radius:var(--radius-md);padding:14px;min-height:70px;border:1px solid var(--border);}
.circle-col.influence-col{background:rgba(16,185,129,.06);border-color:rgba(16,185,129,.35);}
.circle-col.concern-col{background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.35);}
.circle-col h5{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;}
@media(max-width:560px){.circle-cols{grid-template-columns:1fr;}}

.mini-table{width:100%;border-collapse:collapse;margin-top:6px;}
.mini-table th,.mini-table td{border:1px solid var(--border);padding:8px;font-size:12.5px;text-align:left;vertical-align:top;}
.mini-table th{background:var(--bg-panel-2);color:var(--text-mid);font-weight:650;}

.output-box{
  margin-top:16px;background:#0b1324;border:1px solid var(--indigo);border-radius:var(--radius-md);
  padding:16px 18px;font-size:13.5px;line-height:1.75;color:#e0e7ff;white-space:pre-wrap;
}

.lever-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:8px;}
.lever-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;cursor:pointer;background:var(--bg-panel-2);transition:all .15s;}
.lever-card:hover{border-color:var(--indigo);}
.lever-card.active{border-color:var(--emerald);background:rgba(16,185,129,.1);}
.lever-card b{display:block;font-size:14px;margin-bottom:6px;}
.lever-card p{font-size:12.5px;margin:0;color:var(--text-mid);}
.lever-detail{margin-top:14px;font-size:13px;color:var(--text-mid);background:#0b1324;border-radius:10px;padding:12px 14px;display:none;}
.lever-detail.show{display:block;}

/* Quiz */
.quiz-box{margin-top:6px;}
.quiz-q{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.quiz-q:last-child{border-bottom:none;}
.quiz-q-title{font-size:14.5px;font-weight:650;margin-bottom:12px;}
.quiz-opt{
  display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1px solid var(--border);
  border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:13.5px;color:var(--text-mid);transition:all .15s;
}
.quiz-opt:hover{border-color:var(--indigo-light);background:rgba(99,102,241,.06);}
.quiz-opt input{margin-top:3px;accent-color:var(--indigo);}
.quiz-opt.correct{border-color:var(--emerald);background:rgba(16,185,129,.1);color:#d1fae5;}
.quiz-opt.incorrect{border-color:var(--danger);background:rgba(248,113,113,.1);color:#fecaca;}
.quiz-feedback{font-size:12.5px;margin-top:8px;padding:10px 12px;border-radius:8px;background:#0b1324;display:none;line-height:1.6;}
.quiz-feedback.show{display:block;}
.quiz-result{
  text-align:center;padding:26px;border-radius:var(--radius-lg);margin-top:10px;
  border:1px solid var(--border);
}
.quiz-result.pass{background:rgba(16,185,129,.12);border-color:var(--emerald);}
.quiz-result.fail{background:rgba(248,113,113,.1);border-color:var(--danger);}
.quiz-result .score-num{font-size:40px;font-weight:800;margin:6px 0;}

/* Simulator */
.sim-scene-select{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.sim-scene-btn{flex:1;min-width:220px;text-align:left;padding:16px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-panel-2);cursor:pointer;}
.sim-scene-btn:hover{border-color:var(--indigo);}
.sim-scene-btn b{display:block;font-size:14px;margin-bottom:4px;}
.sim-scene-btn span{font-size:12.5px;color:var(--text-low);}
.sim-node{background:#0b1324;border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;margin-top:12px;}
.sim-node-text{font-size:14.5px;line-height:1.7;color:var(--text-hi);margin-bottom:16px;}
.sim-choice{
  display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-panel-2);color:var(--text-mid);font-size:13.5px;margin-bottom:9px;cursor:pointer;transition:all .15s;
}
.sim-choice:hover{border-color:var(--indigo-light);color:var(--text-hi);}
.sim-outcome{border-radius:var(--radius-md);padding:18px;margin-top:8px;}
.sim-outcome.good{background:rgba(16,185,129,.12);border:1px solid var(--emerald);}
.sim-outcome.ok{background:rgba(245,158,11,.12);border:1px solid var(--amber);}
.sim-outcome.bad{background:rgba(248,113,113,.1);border:1px solid var(--danger);}
.sim-outcome b{display:block;margin-bottom:6px;font-size:13.5px;}
.sim-outcome p{margin:0;font-size:13.5px;color:var(--text-mid);line-height:1.65;}
.sim-crumbs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.sim-crumb{font-size:11px;padding:4px 10px;border-radius:99px;background:#0b1324;border:1px solid var(--border);color:var(--text-low);}

/* Diagnostic report */
.style-result{display:flex;align-items:center;gap:18px;padding:20px;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(16,185,129,.08));border:1px solid var(--indigo);border-radius:var(--radius-lg);margin-bottom:20px;}
.style-icon{font-size:38px;flex-shrink:0;width:64px;height:64px;border-radius:16px;background:#0b1324;display:flex;align-items:center;justify-content:center;}
.style-result h3{margin:0 0 4px;font-size:19px;}
.style-result p{margin:0;font-size:13.5px;color:var(--text-mid);}
.trap-list li,.strength-list li{margin-bottom:8px;line-height:1.6;font-size:13.5px;color:var(--text-mid);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:680px){.two-col{grid-template-columns:1fr;}}

.locked-panel{text-align:center;padding:60px 20px;}
.locked-panel .lock-icon{font-size:44px;margin-bottom:14px;opacity:.7;}
.locked-panel h3{font-size:19px;margin:0 0 8px;}
.locked-panel p{color:var(--text-low);font-size:14px;max-width:420px;margin:0 auto;}

.footer-nav{display:flex;justify-content:space-between;margin-top:26px;gap:12px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg-panel);border:1px solid var(--emerald);color:var(--text-hi);
  padding:13px 22px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-2);
  opacity:0;pointer-events:none;transition:all .3s ease;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.modal-backdrop{
  display:none;position:fixed;inset:0;background:rgba(3,7,18,.7);z-index:90;
  align-items:center;justify-content:center;padding:20px;
}
.modal-backdrop.show{display:flex;}
.modal-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;max-width:400px;width:100%;box-shadow:var(--shadow-2);}
.modal-box h3{margin:0 0 10px;font-size:17px;}
.modal-box p{color:var(--text-mid);font-size:13.5px;line-height:1.6;margin:0 0 20px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}

/* Scrollbar */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#334155;border-radius:99px;}

@media(max-width:900px){
  .topbar{display:flex;}
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--shadow-2);}
  .sidebar.open{transform:translateX(0);}
  .overlay.show{display:block;}
  .main{padding:24px 18px 70px;}
  .two-col{grid-template-columns:1fr;}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>

/* =========================================================
   STATE MANAGEMENT
========================================================= */
function defaultState(){
  return {
    currentModule:0,
    m0:{completed:false, styleKey:null, circleScore:null},
    m1:{quizPassed:false, bestScore:0},
    m2:{quizPassed:false, bestScore:0},
    m3:{quizPassed:false, bestScore:0},
    m4:{quizPassed:false, bestScore:0},
    tools:{}
  };
}
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){/* ignore */}
}

function isModuleUnlocked(id){
  if(id===0) return true;
  if(id===1) return true;
  if(id===2) return state.m1.quizPassed;
  if(id===3) return state.m2.quizPassed;
  if(id===4) return state.m3.quizPassed;
  return false;
}
function isModuleDone(id){
  if(id===0) return state.m0.completed;
  return state['m'+id].quizPassed;
}
function overallProgress(){
  let done = 0;
  if(state.m0.completed) done++;
  [1,2,3,4].forEach(i=>{ if(state['m'+i].quizPassed) done++; });
  return Math.round((done/5)*100);
}

/* =========================================================
   TOAST
========================================================= */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* =========================================================
   SIDEBAR / NAV
========================================================= */
function renderSidebar(){
  const nav = document.getElementById('navList');
  nav.innerHTML='';
  MODULES_META.forEach(m=>{
    const unlocked = isModuleUnlocked(m.id);
    const done = isModuleDone(m.id);
    const active = state.currentModule===m.id;
    const div = document.createElement('div');
    div.className = 'nav-item'+(active?' active':'')+(!unlocked?' locked':'')+(done?' done':'');
    div.innerHTML = `
      <div class="nav-badge">${done?'✓':m.icon}</div>
      <div class="nav-labels"><b>${m.title}</b><span>${m.short}</span></div>
      ${!unlocked?'<span class="nav-lock">🔒</span>':''}
    `;
    if(unlocked){
      div.addEventListener('click',()=>{ goToModule(m.id); closeSidebarMobile(); });
    }
    nav.appendChild(div);
  });
  const pct = overallProgress();
  document.getElementById('progressPct').textContent = pct+'%';
  document.getElementById('progressFill').style.width = pct+'%';
}

function goToModule(id){
  if(!isModuleUnlocked(id)){ showToast('Completá el módulo anterior para desbloquear este.'); return; }
  state.currentModule = id;
  saveState();
  renderAll();
  document.getElementById('mainContent').scrollTo?.({top:0});
  window.scrollTo({top:0,behavior:'smooth'});
}

function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

/* =========================================================
   RENDER: MAIN CONTENT ROUTER
========================================================= */
function renderAll(){
  renderSidebar();
  const main = document.getElementById('mainContent');
  const id = state.currentModule;
  if(!isModuleUnlocked(id)){
    main.innerHTML = lockedPanelHTML();
    return;
  }
  if(id===0) main.innerHTML = renderModule0();
  else main.innerHTML = renderGenericModule(id);
  attachModuleHandlers(id);
}

function lockedPanelHTML(){
  return `<div class="card locked-panel">
    <div class="lock-icon">🔒</div>
    <h3>Módulo bloqueado</h3>
    <p>Aprobá el cuestionario del módulo anterior con al menos 80% para desbloquear este contenido.</p>
  </div>`;
}

function footerNavHTML(id){
  const prev = id>0 ? MODULES_META.find(m=>m.id===id-1) : null;
  const nextMeta = MODULES_META.find(m=>m.id===id+1);
  let nextHTML='';
  if(nextMeta){
    const unlocked = isModuleUnlocked(nextMeta.id);
    nextHTML = `<button class="btn ${unlocked?'btn-primary':'btn-ghost'}" id="footNextBtn" ${unlocked?'':'disabled'}>Siguiente módulo →</button>`;
  }
  return `<div class="footer-nav">
    ${prev?`<button class="btn btn-ghost" id="footPrevBtn">← ${prev.title}</button>`:'<span></span>'}
    ${nextHTML}
  </div>`;
}

function moduleContent(id){
  return {1:M1,2:M2,3:M3,4:M4}[id];
}

function renderGenericModule(id){

  const meta = MODULES_META.find(m=>m.id===id);

/* ---- Tools per module ---- */
function renderTool(id){
  if(id===1){
    return `
      <h3>Calculadora de la Matriz de Credibilidad</h3>
      <p>Movés cada control para autoevaluarte del 0 al 10 en cada pilar de tu credibilidad lateral.</p>
      <div class="tool-block">
        ${['Competencia','Coherencia','Empatía'].map(dim=>`
          <div class="field-row">
            <label>${dim}: <span class="slider-value" id="val_${dim}">5</span>/10</label>
            <input type="range" min="0" max="10" value="5" class="cred-slider" data-dim="${dim}">
          </div>
        `).join('')}
        <div id="credResult" class="output-box" style="display:none;"></div>
      </div>

      <h3 style="margin-top:26px;">Círculo de Influencia vs. Círculo de Preocupación</h3>
      <p>Tocá cada situación y clasificala según si está dentro de tu control directo o no.</p>
      <div class="tool-block">
        <div class="chip-grid" id="circleChips">
          ${CIRCLE_ITEMS.map((it,i)=>`<div class="chip" data-idx="${i}" data-state="none">${it.t}</div>`).join('')}
        </div>
        <div class="circle-cols">
          <div class="circle-col influence-col"><h5>🟢 Círculo de Influencia</h5><div id="colInfluence" style="font-size:12.5px;color:var(--text-low);">Tocá los ítems de arriba para clasificarlos aquí.</div></div>
          <div class="circle-col concern-col"><h5>🟠 Círculo de Preocupación</h5><div id="colConcern" style="font-size:12.5px;color:var(--text-low);"></div></div>
        </div>
        <div id="circleToolResult" class="output-box" style="display:none;margin-top:14px;"></div>
      </div>
    `;
  }
  if(id===2){
    return `
      <h3>Generador de Propuestas de Impacto</h3>
      <p>Completá los cuatro campos para estructurar tu propuesta lateral.</p>
      <div class="tool-block">
        <div class="field-row"><label>¿Qué problema resuelve?</label><textarea id="pi_problema" rows="2" placeholder="Ej: perdemos tiempo re-explicando el mismo procedimiento cada semana."></textarea></div>
        <div class="field-row"><label>¿Qué gana el equipo?</label><textarea id="pi_equipo" rows="2" placeholder="Ej: menos interrupciones repetitivas, más foco."></textarea></div>

/* ---- Quiz rendering ---- */
function renderQuiz(id){
  const data = moduleContent(id);
  const qs = data.quiz;
  let html = `<div class="quiz-box" id="quizForm_${id}">`;
  qs.forEach((q,qi)=>{
    html += `<div class="quiz-q" data-qi="${qi}">
      <div class="quiz-q-title">${qi+1}. ${q.q}</div>
      ${q.opts.map((o,oi)=>`
        <label class="quiz-opt" data-oi="${oi}">
          <input type="radio" name="mquiz_${id}_${qi}" value="${oi}">
          <span>${o.t}</span>
        </label>`).join('')}
      <div class="quiz-feedback" id="fb_${id}_${qi}"></div>

/* =========================================================
   EVENT HANDLERS
========================================================= */
function attachModuleHandlers(id){
  if(id===0){ attachModule0Handlers(); return; }

  // Tabs
  document.querySelectorAll(`#tabs_${id} .tab-btn`).forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll(`#tabs_${id} .tab-btn`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const idx = btn.getAttribute('data-tab');
      document.querySelectorAll(`.tab-panel[data-panel]`).forEach(p=>{
        if(p.closest('.card').querySelector(`#tabs_${id}`)){
          p.classList.toggle('active', p.getAttribute('data-panel')===idx);
        }
      });
    });
  });

  // Accordion
  document.querySelectorAll('.accordion-item').forEach(item=>{
    const head = item.querySelector('.accordion-head');
    const body = item.querySelector('.accordion-body');
    head.addEventListener('click',()=>{
      const open = item.classList.contains('open');
      item.classList.toggle('open');
      body.style.maxHeight = open?'0px':(body.scrollHeight+40)+'px';
    });
  });

  // Flip cards
  document.querySelectorAll('.flip-card').forEach(card=>{
    card.addEventListener('click',()=>card.classList.toggle('flipped'));
  });

  // Tools
  if(id===1) attachTool1();
  if(id===2) attachTool2();
  if(id===3) attachTool3();
  if(id===4) attachTool4();

  // Quiz
  attachQuizHandlers(id);

  // Footer nav
  const prevBtn = document.getElementById('footPrevBtn');
  if(prevBtn) prevBtn.addEventListener('click',()=>goToModule(id-1));
  const nextBtn = document.getElementById('footNextBtn');
  if(nextBtn) nextBtn.addEventListener('click',()=>{
    if(isModuleUnlocked(id+1)) goToModule(id+1);
    else showToast('Aprobá el cuestionario de este módulo para avanzar.');
  });
}

/* ---- Module 0 handlers ---- */
function attachModule0Handlers(){
  document.querySelectorAll('.circle-range').forEach(r=>{
    r.addEventListener('input',()=>{
      document.querySelector(`.circle-range-val[data-qi="${r.getAttribute('data-qi')}"]`).textContent = r.value;
    });
  });

  const submitBtn = document.getElementById('submitDiagBtn');
  if(submitBtn){
    submitBtn.addEventListener('click',()=>{
      // validate all style questions answered
      let allAnswered = true;
      const tally = {conector:0,referente:0,modelo:0,pasivo:0};
      DIAG_STYLE_QUESTIONS.forEach((q,qi)=>{
        const sel = document.querySelector(`input[name="diagstyle_${qi}"]:checked`);
        if(!sel){ allAnswered=false; return; }
        const style = q.opts[parseInt(sel.value)].s;
        tally[style]++;
      });
      if(!allAnswered){ showToast('Respondé todas las preguntas para ver tu resultado.'); return; }

      let dominant='conector', max=-1;
      Object.keys(tally).forEach(k=>{ if(tally[k]>max){ max=tally[k]; dominant=k; } });

      let circleSum=0;
      DIAG_CIRCLE_QUESTIONS.forEach((q,qi)=>{
        const r = document.querySelector(`.circle-range[data-qi="${qi}"]`);
        circleSum += r ? parseInt(r.value) : 3;
      });
      const circleScore = Math.round((circleSum/(DIAG_CIRCLE_QUESTIONS.length*5))*100);

      state.m0.completed = true;
      state.m0.styleKey = dominant;
      state.m0.circleScore = circleScore;
      saveState();
      renderAll();
      showToast('¡Perfil generado! Este es tu punto de partida.');
    });
  }

  const retakeBtn = document.getElementById('retakeDiagBtn');
  if(retakeBtn){
    retakeBtn.addEventListener('click',()=>{
      state.m0.completed=false; state.m0.styleKey=null; state.m0.circleScore=null;
      saveState(); renderAll();
    });
  }
  const nextBtn = document.getElementById('footNextBtn');
  if(nextBtn) nextBtn.addEventListener('click',()=>goToModule(1));
}

/* ---- Tool 1: Credibilidad + Círculo ---- */
function attachTool1(){
  const sliders = document.querySelectorAll('.cred-slider');
  function updateCred(){
    let sum=0;
    sliders.forEach(s=>{
      document.getElementById('val_'+s.getAttribute('data-dim')).textContent = s.value;
      sum += parseInt(s.value);
    });
    const avg = sum/sliders.length;
    const box = document.getElementById('credResult');
    let level = avg<4?'Bajo':avg<=7?'Moderado':'Alto';
    let msg = avg<4
      ? 'Tu credibilidad lateral percibida podría ser frágil todavía. Elegí el pilar más bajo y planificá una acción concreta esta semana para fortalecerlo.'
      : avg<=7
      ? 'Tenés una base sólida de credibilidad. Identificá el pilar más bajo de los tres para llevarlo al siguiente nivel.'
      : 'Tu credibilidad lateral percibida es alta en los tres pilares. El foco ahora es sostenerla en el tiempo con consistencia.';
    box.style.display='block';
    box.innerHTML = `<b>Nivel de credibilidad: ${level} (${avg.toFixed(1)}/10)</b>\n\n${msg}`;
  }
  sliders.forEach(s=>s.addEventListener('input',updateCred));
  updateCred();

  // Circle chips
  const chips = document.querySelectorAll('#circleChips .chip');
  const state_map = {}; // idx -> 'influence' | 'concern' | none
  function renderCols(){
    const colI = document.getElementById('colInfluence');
    const colC = document.getElementById('colConcern');
    const infItems = Object.keys(state_map).filter(k=>state_map[k]==='influence').map(k=>CIRCLE_ITEMS[k].t);
    const conItems = Object.keys(state_map).filter(k=>state_map[k]==='concern').map(k=>CIRCLE_ITEMS[k].t);
    colI.innerHTML = infItems.length? infItems.map(t=>`<div style="margin-bottom:4px;">• ${t}</div>`).join('') : 'Tocá los ítems de arriba para clasificarlos aquí.';
    colC.innerHTML = conItems.length? conItems.map(t=>`<div style="margin-bottom:4px;">• ${t}</div>`).join('') : '';

    const classified = Object.keys(state_map).length;
    const resultBox = document.getElementById('circleToolResult');
    if(classified === CIRCLE_ITEMS.length){
      let correct=0;
      CIRCLE_ITEMS.forEach((it,i)=>{
        const guess = state_map[i]==='influence';
        if(guess===it.influence) correct++;
      });
      const pct = Math.round((correct/CIRCLE_ITEMS.length)*100);
      resultBox.style.display='block';
      resultBox.innerHTML = `<b>Precisión de tu clasificación: ${pct}%</b>\n\n${pct>=75?'Distinguís con claridad qué está dentro de tu control directo. Esa es la base para invertir tu energía donde realmente genera cambio.':'Revisá los ítems marcados: algunos que clasificaste como "fuera de tu control" en realidad dependen de tus propias acciones y decisiones.'}`;
    } else {
      resultBox.style.display='none';
    }
  }
  chips.forEach(chip=>{
    chip.addEventListener('click',()=>{
      const idx = chip.getAttribute('data-idx');
      const cur = state_map[idx];
      let next;
      if(cur===undefined) next='influence';
      else if(cur==='influence') next='concern';
      else next=undefined;
      if(next===undefined){ delete state_map[idx]; chip.classList.remove('sel-influence','sel-concern'); }
      else { state_map[idx]=next; chip.classList.remove('sel-influence','sel-concern'); chip.classList.add(next==='influence'?'sel-influence':'sel-concern'); }
      renderCols();
    });
  });
  renderCols();
}

function renderSimNode(sceneKey, nodeId, path){
  const scene = SIM_SCENES[sceneKey];
  const node = scene.nodes[nodeId];
  const area = document.getElementById('simArea');
  const crumbs = path.map((p,i)=>`<span class="sim-crumb">Paso ${i+1}: ${p}</span>`).join('');

  if(node.outcome){
    const o = node.outcome;
    const label = o.type==='good'?'✅ Resultado favorable':o.type==='ok'?'🟡 Resultado parcial':'❌ Resultado desfavorable';
    area.innerHTML = `
      <div class="sim-crumbs">${crumbs}</div>
      <div class="sim-outcome ${o.type}"><b>${label}</b><p>${o.text}</p></div>
      <button class="btn btn-ghost btn-sm" id="simRestartBtn" style="margin-top:14px;">↺ Probar otro camino</button>
    `;
    document.getElementById('simRestartBtn').addEventListener('click',()=>{ area.innerHTML=''; });
    return;
  }

  area.innerHTML = `
    <div class="sim-crumbs">${crumbs}</div>
    <div class="sim-node">
      <div class="sim-node-text">${node.text}</div>
      ${node.choices.map(c=>`<button class="sim-choice" data-next="${c.next}">${c.label}</button>`).join('')}
    </div>
  `;
  area.querySelectorAll('.sim-choice').forEach((btn,i)=>{
    btn.addEventListener('click',()=>{
      const choice = node.choices[i];
      renderSimNode(sceneKey, choice.next, path.concat(choice.label));
    });
  });
}

/* ---- Quiz handlers (modules 1-4) ---- */
function attachQuizHandlers(id){
  const submitBtn = document.getElementById('submitQuizBtn_'+id);
  if(!submitBtn) return;
  submitBtn.addEventListener('click',()=>{
    const data = moduleContent(id);
    let allAnswered = true;
    let correctCount = 0;

    data.quiz.forEach((q,qi)=>{
      const sel = document.querySelector(`input[name="mquiz_${id}_${qi}"]:checked`);
      if(!sel){ allAnswered=false; return; }
      const oi = parseInt(sel.value);
      const opts = document.querySelectorAll(`.quiz-q[data-qi="${qi}"] .quiz-opt`);
      opts.forEach((optEl,idx)=>{
        optEl.classList.remove('correct','incorrect');
        if(idx===oi){
          optEl.classList.add(q.opts[idx].correct?'correct':'incorrect');
        }
        if(q.opts[idx].correct && idx!==oi){
          optEl.classList.add('correct');
        }
      });
      const fb = document.getElementById(`fb_${id}_${qi}`);
      fb.classList.add('show');
      fb.textContent = (q.opts[oi].correct?'✔ Correcto. ':'✘ Incorrecto. ') + q.opts[oi].fb;
      if(q.opts[oi].correct) correctCount++;
    });

    if(!allAnswered){ showToast('Respondé todas las preguntas antes de corregir.'); return; }

    const total = data.quiz.length;
    const pct = Math.round((correctCount/total)*100);
    const passed = pct>=80;

    if(pct > state['m'+id].bestScore) state['m'+id].bestScore = pct;
    if(passed) state['m'+id].quizPassed = true;
    saveState();

    const resultArea = document.getElementById('quizResultArea_'+id);
    resultArea.innerHTML = `
      <div class="quiz-result ${passed?'pass':'fail'}">
        <div style="font-size:13px;color:var(--text-mid);">Tu puntuación</div>
        <div class="score-num">${pct}%</div>
        <div style="font-size:13.5px;color:var(--text-mid);">${correctCount} de ${total} respuestas correctas</div>
        <p style="margin-top:10px;">${passed?'¡Aprobaste el módulo! Ya podés avanzar al siguiente.':'Necesitás al menos 80% para aprobar. Revisá la retroalimentación de cada pregunta y volvé a intentarlo.'}</p>
        ${passed && MODULES_META.find(m=>m.id===id+1) ? `<button class="btn btn-primary btn-sm" id="goNextAfterQuiz" style="margin-top:8px;">Ir al siguiente módulo →</button>` : ''}
        ${!passed ? `<button class="btn btn-amber btn-sm" id="retryQuizBtn" style="margin-top:8px;">Reintentar cuestionario</button>` : ''}
      </div>
    `;
    renderSidebar();

    const goNext = document.getElementById('goNextAfterQuiz');
    if(goNext) goNext.addEventListener('click',()=>goToModule(id+1));
    const retry = document.getElementById('retryQuizBtn');
    if(retry) retry.addEventListener('click',()=>{
      document.getElementById('quizArea_'+id).innerHTML = renderQuiz(id);
      attachQuizHandlers(id);
    });

    if(passed) showToast('¡Módulo aprobado! Siguiente módulo desbloqueado.');
  });
}

function downloadResultsPDF(){
  const html = buildResultsHTML();
  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();
  showToast('Preparando PDF... elegí "Guardar como PDF" en el diálogo de impresión.');
  setTimeout(()=>{
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(()=>{ if(iframe.parentNode) document.body.removeChild(iframe); }, 1000);
  }, 350);
}

document.getElementById('downloadResultsBtn').addEventListener('click', downloadResultsPDF);

/* =========================================================
   RESET / MODALS
========================================================= */
document.getElementById('resetBtn').addEventListener('click',()=>{
  document.getElementById('resetModal').classList.add('show');
});
document.getElementById('cancelReset').addEventListener('click',()=>{
  document.getElementById('resetModal').classList.remove('show');
});
document.getElementById('confirmReset').addEventListener('click',()=>{
  state = defaultState();
  saveState();
  document.getElementById('resetModal').classList.remove('show');
  renderAll();
  showToast('Curso reiniciado desde cero.');
});

/* Mobile sidebar */
document.getElementById('hamburgerBtn').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
});
document.getElementById('overlay').addEventListener('click', closeSidebarMobile);

/* =========================================================
   INIT
========================================================= */
if(!isModuleUnlocked(state.currentModule)) state.currentModule = 0;
renderAll();

})();
</script>
