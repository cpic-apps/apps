<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brújula del Conflicto · Gestión y Resolución de Conflictos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#12213d;
  --navy-700:#1c3560;
  --blue-500:#3b6ea5;
  --blue-100:#e7eef6;
  --gray-050:#f6f7f9;
  --gray-100:#eef0f3;
  --gray-200:#e1e5eb;
  --gray-400:#a7afbc;
  --gray-600:#5b6472;
  --ink:#1b2130;
  --amber-500:#e29b3c;
  --amber-100:#faead0;
  --green-500:#3f9152;
  --green-100:#e3f3e6;
  --red-500:#c14a3d;
  --red-100:#fbe7e4;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --shadow-sm:0 1px 2px rgba(18,33,61,.06), 0 1px 1px rgba(18,33,61,.04);
  --shadow-md:0 8px 24px rgba(18,33,61,.10);
  --shadow-lg:0 20px 48px rgba(18,33,61,.16);
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  background:var(--gray-050);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:3px solid var(--amber-500); outline-offset:2px;}
a{color:inherit;}

/* ---------- App shell ---------- */
.app{display:flex; min-height:100vh;}

/* Sidebar */
.sidebar{
  width:280px; flex-shrink:0;
  background:linear-gradient(185deg, var(--navy-900), var(--navy-700) 130%);
  color:#fff;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  z-index:40;
}
.brand{
  display:flex; align-items:center; gap:12px;
  padding:28px 24px 20px;
}
.brand-mark{width:38px; height:38px; flex-shrink:0;}
.org-logo-strip{
  background:#fff; border-radius:var(--radius-m); padding:14px 16px;
  margin:20px 20px 4px; display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-sm);
}
.org-logo-strip img{display:block; width:100%; max-width:210px; height:auto;}
.topbar .org-logo-mini{height:30px; width:auto; border-radius:5px; background:#fff; padding:3px 6px; flex-shrink:0;}
.brand-text{font-family:var(--font-display); font-weight:600; font-size:1.05rem; line-height:1.15;}
.brand-text span{display:block; font-family:var(--font-mono); font-weight:500; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:#a9c0e0; margin-top:3px;}

.progress-wrap{padding:0 24px 22px;}
.progress-label{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:.7rem; letter-spacing:.04em; color:#9fb6d8; margin-bottom:8px; text-transform:uppercase;}
.progress-track{height:7px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden;}
.progress-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--amber-500),#f0bb6e); width:0%; transition:width .5s cubic-bezier(.4,0,.2,1);}

.navlist{list-style:none; padding:6px 14px 20px; flex:1;}
.navlist li{margin-bottom:6px;}
.navbtn{
  width:100%; display:flex; align-items:center; gap:12px;
  background:transparent; border:none; color:#cfdbef;
  text-align:left; padding:12px 14px; border-radius:var(--radius-s);
  font-size:.9rem; font-weight:500; transition:background .18s, color .18s;
  position:relative;
}
.navbtn:hover:not(.locked){background:rgba(255,255,255,.08); color:#fff;}
.navbtn.active{background:rgba(255,255,255,.14); color:#fff;}
.navbtn.active::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; background:var(--amber-500); border-radius:99px;}
.navbtn.locked{color:#5d6d8a; cursor:not-allowed;}
.nav-icon{
  width:28px; height:28px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:.72rem; font-weight:600;
  background:rgba(255,255,255,.08); color:#cfdbef;
}
.navbtn.active .nav-icon{background:var(--amber-500); color:var(--navy-900);}
.navbtn.done .nav-icon{background:var(--green-500); color:#fff;}
.nav-title{flex:1;}
.nav-sub{display:block; font-size:.72rem; color:#8ea3c5; font-weight:400; margin-top:1px;}
.lock-dot{width:14px; height:14px; opacity:.6;}

.sidebar-footer{padding:16px 24px 24px; border-top:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; gap:8px;}
.reset-btn{
  width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
  color:#cfdbef; padding:10px 12px; border-radius:var(--radius-s); font-size:.78rem; font-weight:500;
  transition:background .18s;
}
.reset-btn:hover{background:rgba(255,255,255,.14);}
.download-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--amber-500); border:1px solid var(--amber-500);
  color:var(--navy-900); padding:11px 12px; border-radius:var(--radius-s); font-size:.8rem; font-weight:700;
  transition:background .18s, transform .18s;
}
.download-btn:hover{background:#eaa94e; transform:translateY(-1px);}
.download-btn:disabled{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14); color:#5d6d8a; cursor:not-allowed; transform:none;}

/* ---------- Printable PDF report (hidden on screen) ---------- */
#printArea{display:none;}
@media print{
  body > .app > *:not(#printArea){display:none !important;}
  #printArea{display:block !important;}
  @page{margin:16mm;}
}
.pdf-header{display:flex; align-items:center; gap:16px; border-bottom:2px solid var(--navy-900); padding-bottom:14px; margin-bottom:22px;}
.pdf-header img{height:46px; width:auto;}
.pdf-header .pdf-htitle{font-family:var(--font-display); font-size:1.3rem; font-weight:700; color:var(--navy-900);}
.pdf-header .pdf-hsub{font-family:var(--font-mono); font-size:.72rem; color:var(--gray-600); margin-top:2px;}
.pdf-section{margin-bottom:26px; page-break-inside:avoid;}
.pdf-section h2{font-family:var(--font-display); font-size:1.1rem; color:var(--navy-900); border-bottom:1px solid var(--gray-200); padding-bottom:6px; margin-bottom:10px;}
.pdf-section h3{font-family:var(--font-display); font-size:.98rem; color:var(--navy-900); margin:14px 0 4px;}
.pdf-meta{font-size:.82rem; color:var(--gray-600); margin-bottom:4px;}
.pdf-badge{display:inline-block; font-family:var(--font-mono); font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:99px; margin-left:8px;}
.pdf-badge.pass{background:var(--green-100); color:#245a30;}
.pdf-badge.fail{background:var(--red-100); color:#7d2c22;}
.pdf-qblock{border:1px solid var(--gray-200); border-radius:8px; padding:10px 14px; margin-bottom:10px; page-break-inside:avoid;}
.pdf-qblock .pdf-qtext{font-weight:600; font-size:.88rem; color:var(--navy-900); margin-bottom:6px;}
.pdf-qblock .pdf-row{font-size:.82rem; margin-bottom:3px;}
.pdf-row.ok{color:#245a30;}
.pdf-row.bad{color:#7d2c22;}
.pdf-bars{margin:10px 0 4px;}
.pdf-bar-row{display:flex; align-items:center; gap:10px; font-size:.82rem; margin-bottom:6px;}
.pdf-bar-name{width:120px; flex-shrink:0; font-weight:600;}
.pdf-bar-track{flex:1; height:8px; background:var(--gray-100); border-radius:99px; overflow:hidden;}
.pdf-bar-fill{height:100%; border-radius:99px;}
.pdf-bar-val{width:30px; text-align:right; font-family:var(--font-mono); font-size:.75rem;}
.pdf-empty{font-size:.85rem; color:var(--gray-600); font-style:italic;}

/* Mobile top bar */
.topbar{display:none;}

/* Main */
.main{flex:1; min-width:0; padding:44px 48px 100px; max-width:980px;}
.module-eyebrow{
  font-family:var(--font-mono); font-size:.72rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--blue-500); font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.module-title{font-family:var(--font-display); font-size:2.05rem; font-weight:700; color:var(--navy-900); line-height:1.15; margin-bottom:14px;}
.module-intro{font-size:1.03rem; color:var(--gray-600); max-width:640px; line-height:1.6; margin-bottom:36px;}

section.view{display:none; animation:fadein .35s ease;}
section.view.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* Cards / accordions / tabs */
.card{background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius-l); box-shadow:var(--shadow-sm); padding:28px; margin-bottom:24px;}
.section-label{font-family:var(--font-mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gray-600); font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.section-label::after{content:""; flex:1; height:1px; background:var(--gray-200);}

.tabbar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.tabbtn{
  background:var(--gray-100); border:1px solid transparent; color:var(--gray-600);
  padding:9px 16px; border-radius:99px; font-size:.85rem; font-weight:600; transition:all .18s;
}
.tabbtn:hover{background:var(--blue-100); color:var(--navy-700);}
.tabbtn.active{background:var(--navy-900); color:#fff;}
.tabpanel{display:none;}
.tabpanel.active{display:block; animation:fadein .3s ease;}
.tabpanel h4{font-family:var(--font-display); font-size:1.15rem; color:var(--navy-900); margin-bottom:10px;}
.tabpanel p{color:var(--ink); line-height:1.7; font-size:.96rem;}
.tabpanel ul{margin:12px 0 0 20px; color:var(--ink); line-height:1.75; font-size:.95rem;}

.accordion-item{border:1px solid var(--gray-200); border-radius:var(--radius-m); margin-bottom:10px; overflow:hidden;}
.accordion-head{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:#fff; border:none; padding:16px 18px; text-align:left;
  font-weight:600; font-size:.95rem; color:var(--navy-900);
}
.accordion-head:hover{background:var(--gray-050);}
.accordion-chevron{transition:transform .25s; flex-shrink:0; color:var(--blue-500);}
.accordion-item.open .accordion-chevron{transform:rotate(180deg);}
.accordion-body{max-height:0; overflow:hidden; transition:max-height .3s ease;}
.accordion-body-inner{padding:0 18px 18px; color:var(--gray-600); font-size:.93rem; line-height:1.7;}
.accordion-body-inner ul{margin:10px 0 0 18px; line-height:1.7;}

.case-box{background:var(--blue-100); border-left:4px solid var(--blue-500); border-radius:var(--radius-m); padding:22px 24px;}
.case-box .case-tag{font-family:var(--font-mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--blue-500); font-weight:700; margin-bottom:8px; display:block;}
.case-box p{font-size:.95rem; line-height:1.7; color:var(--navy-900);}
.case-box p + p{margin-top:10px;}

/* Quiz */
.quiz-progress{display:flex; gap:6px; margin-bottom:20px;}
.quiz-dot{flex:1; height:5px; border-radius:99px; background:var(--gray-200);}
.quiz-dot.done{background:var(--green-500);}
.quiz-dot.wrong{background:var(--red-500);}
.quiz-dot.current{background:var(--blue-500);}
.q-count{font-family:var(--font-mono); font-size:.75rem; color:var(--gray-600); margin-bottom:6px;}
.q-text{font-family:var(--font-display); font-size:1.18rem; font-weight:600; color:var(--navy-900); margin-bottom:20px; line-height:1.4;}
.options{display:flex; flex-direction:column; gap:10px;}
.option{
  display:flex; align-items:flex-start; gap:12px; text-align:left;
  background:#fff; border:1.5px solid var(--gray-200); border-radius:var(--radius-m);
  padding:14px 16px; font-size:.93rem; color:var(--ink); transition:all .15s;
}
.option:hover:not(:disabled){border-color:var(--blue-500); background:var(--blue-100);}
.option .opt-letter{
  width:24px; height:24px; border-radius:7px; background:var(--gray-100); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:600; font-size:.75rem; color:var(--gray-600);
}
.option.correct{border-color:var(--green-500); background:var(--green-100);}
.option.correct .opt-letter{background:var(--green-500); color:#fff;}
.option.incorrect{border-color:var(--red-500); background:var(--red-100);}
.option.incorrect .opt-letter{background:var(--red-500); color:#fff;}
.option:disabled{cursor:default;}

.feedback{
  margin-top:16px; padding:16px 18px; border-radius:var(--radius-m); font-size:.9rem; line-height:1.6;
  display:none; align-items:flex-start; gap:10px;
}
.feedback.show{display:flex; animation:fadein .25s ease;}
.feedback.ok{background:var(--green-100); color:#245a30; border:1px solid #bfe3c6;}
.feedback.bad{background:var(--red-100); color:#7d2c22; border:1px solid #f0c3bc;}
.feedback .fb-icon{flex-shrink:0; margin-top:1px;}

.quiz-actions{display:flex; justify-content:flex-end; margin-top:22px;}

.btn{
  font-family:var(--font-body); font-weight:600; font-size:.9rem; padding:12px 22px;
  border-radius:99px; border:none; transition:all .18s; display:inline-flex; align-items:center; gap:8px;
}
.btn-primary{background:var(--navy-900); color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--navy-700); transform:translateY(-1px); box-shadow:var(--shadow-md);}
.btn-primary:disabled{background:var(--gray-200); color:var(--gray-400); cursor:not-allowed;}
.btn-amber{background:var(--amber-500); color:var(--navy-900);}
.btn-amber:hover{background:#eaa94e; transform:translateY(-1px); box-shadow:var(--shadow-md);}
.btn-ghost{background:transparent; color:var(--navy-700); border:1.5px solid var(--gray-200);}
.btn-ghost:hover{border-color:var(--blue-500); color:var(--blue-500);}

.quiz-result{text-align:center; padding:28px 20px;}
.quiz-result .score-ring{margin:0 auto 18px;}
.quiz-result h3{font-family:var(--font-display); font-size:1.4rem; color:var(--navy-900); margin-bottom:8px;}
.quiz-result p{color:var(--gray-600); font-size:.94rem; max-width:420px; margin:0 auto 20px;}
.quiz-result .btn{margin:0 6px;}

/* Module 0 diagnostic */
.diag-hero{text-align:center; max-width:560px; margin:0 auto 30px;}
.diag-hero svg{margin-bottom:14px;}
.result-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:24px;}
@media (max-width:720px){.result-grid{grid-template-columns:1fr;}}
.result-style-card{
  background:linear-gradient(160deg, var(--navy-900), var(--navy-700));
  color:#fff; border-radius:var(--radius-l); padding:30px; text-align:center; grid-column:1/-1;
}
.result-style-card .rs-label{font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:#a9c0e0; margin-bottom:6px;}
.result-style-card h3{font-family:var(--font-display); font-size:1.9rem; margin-bottom:10px;}
.result-style-card p{color:#d6e2f2; font-size:.92rem; max-width:460px; margin:0 auto; line-height:1.6;}
.result-col{background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius-m); padding:22px;}
.result-col h4{font-family:var(--font-display); font-size:1rem; color:var(--navy-900); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.result-col ul{margin-left:18px; font-size:.9rem; color:var(--ink); line-height:1.75;}
.style-bars{margin-top:26px;}
.style-bar-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.style-bar-name{width:110px; font-size:.82rem; font-weight:600; color:var(--gray-600); flex-shrink:0;}
.style-bar-track{flex:1; height:10px; background:var(--gray-100); border-radius:99px; overflow:hidden;}
.style-bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--blue-500),var(--navy-900)); width:0%; transition:width 1s cubic-bezier(.4,0,.2,1);}
.style-bar-val{width:26px; text-align:right; font-family:var(--font-mono); font-size:.78rem; color:var(--gray-600);}

/* Landing / module 4 case grid */
.case-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media (max-width:720px){.case-grid{grid-template-columns:1fr;}}

.finish-banner{
  background:linear-gradient(135deg, var(--amber-100), #fff); border:1px solid var(--amber-500);
  border-radius:var(--radius-l); padding:32px; text-align:center; margin-top:30px;
}
.finish-banner h3{font-family:var(--font-display); font-size:1.5rem; color:var(--navy-900); margin-bottom:10px;}
.finish-banner p{color:var(--gray-600); max-width:480px; margin:0 auto 18px;}

.locked-notice{
  display:flex; align-items:center; gap:14px; background:#fff; border:1px dashed var(--gray-400);
  border-radius:var(--radius-l); padding:26px; color:var(--gray-600); font-size:.92rem;
}

.next-cta{display:flex; justify-content:flex-end; margin-top:8px;}

/* Mobile */
.hamburger{display:none;}
@media (max-width:900px){
  .app{flex-direction:column;}
  .sidebar{
    position:fixed; left:0; top:0; height:100vh; transform:translateX(-100%);
    transition:transform .3s ease; width:82%; max-width:320px; box-shadow:var(--shadow-lg);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(18,33,61,.5); z-index:35;}
  .sidebar-backdrop.show{display:block;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:16px 18px; background:var(--navy-900); color:#fff; position:sticky; top:0; z-index:30;
  }
  .topbar .brand{padding:0;}
  .topbar .brand-text{font-size:.92rem;}
  .hamburger{
    display:flex; flex-direction:column; gap:4px; background:none; border:none; padding:8px;
  }
  .hamburger span{width:22px; height:2px; background:#fff; border-radius:2px;}
  .main{padding:28px 18px 80px;}
  .module-title{font-size:1.6rem;}
  .result-style-card{padding:22px;}
}
</style>
</head>

/* ============================= STATE ============================= */

const STORAGE_KEY = "brujula_conflicto_progress_v1";
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { completed:[], m0Result:null, quizState:{} };
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function isCompleted(id){ return state.completed.includes(id); }
function isUnlocked(id){
  if(id === 0) return true;
  return isCompleted(id-1);
}
function markCompleted(id){
  if(!isCompleted(id)){ state.completed.push(id); saveState(); }
}

/* ============================= NAV ============================= */

const NAV_META = [
  {id:0, label:"Autodiagnóstico", sub:"Test de estilo de conflicto", icon:"D0"},
  {id:1, label:"Fundamentos", sub:"Conflicto y percepción", icon:"01"},
  {id:2, label:"Comunicación", sub:"Asertividad y escucha", icon:"02"},
  {id:3, label:"Negociación", sub:"Estrategias de resolución", icon:"03"},
  {id:4, label:"Aplicación", sub:"Casos reales", icon:"04"}
];

let currentView = 0;

function renderNav(){
  const ul = document.getElementById("navlist");
  ul.innerHTML = "";
  NAV_META.forEach(item=>{
    const li = document.createElement("li");
    const unlocked = isUnlocked(item.id);
    const done = isCompleted(item.id);
    const btn = document.createElement("button");
    btn.className = "navbtn" + (item.id===currentView?" active":"") + (!unlocked?" locked":"") + (done?" done":"");
    btn.setAttribute("aria-current", item.id===currentView ? "page" : "false");
    btn.disabled = !unlocked;
    btn.innerHTML = `
      <span class="nav-icon">${done ? "✓" : item.icon}</span>
      <span class="nav-title">${item.label}<span class="nav-sub">${item.sub}</span></span>
      ${!unlocked ? lockIcon() : ""}
    `;
    btn.addEventListener("click", ()=>{ if(unlocked){ goTo(item.id); closeSidebarMobile(); }});
    li.appendChild(btn);
    ul.appendChild(li);
  });
  const pct = Math.round((state.completed.length / NAV_META.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "%";
}

function lockIcon(){
  return `<svg class="lock-dot" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.3"/></svg>`;
}

function goTo(id){
  currentView = id;
  document.querySelectorAll("section.view").forEach(s=>s.classList.remove("active"));
  document.getElementById("view-"+id).classList.add("active");
  renderNav();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ============================= RENDER: MODULE 0 ============================= */

function renderModule0(){
  const el = document.getElementById("view-0");
  if(state.m0Result){
    el.innerHTML = module0ResultHTML(state.m0Result);
    attachM0ResultEvents();
    return;
  }
  el.innerHTML = `
    <div class="module-eyebrow">Módulo 0 · Punto de partida</div>
    <h1 class="module-title">Autodiagnóstico Inicial</h1>
    <p class="module-intro">Antes de aprender técnicas nuevas, conviene entender cómo reaccionás hoy frente a un conflicto. Respondé con tu reacción más habitual, no con la que te gustaría tener.</p>
    <div class="diag-hero">${M0_INTRO_SVG}</div>
    <div class="card" id="diagCard"></div>
  `;
  renderDiagQuestion(0, {});
}

function renderDiagQuestion(idx, answers){
  const card = document.getElementById("diagCard");
  const q = DIAG_QUESTIONS[idx];
  card.innerHTML = `
    <div class="quiz-progress">
      ${DIAG_QUESTIONS.map((_,i)=>`<div class="quiz-dot ${i<idx?'done':(i===idx?'current':'')}"></div>`).join("")}
    </div>
    <div class="q-count">Pregunta ${idx+1} de ${DIAG_QUESTIONS.length}</div>
    <div class="q-text">${q.q}</div>
    <div class="options" id="diagOptions">
      ${q.options.map((o,i)=>`<button class="option" data-i="${i}"><span class="opt-letter">${String.fromCharCode(97+i)}</span><span>${o.t}</span></button>`).join("")}
    </div>
  `;
  card.querySelectorAll(".option").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const i = parseInt(btn.dataset.i,10);
      const newAnswers = Object.assign({}, answers, {[idx]: {style:q.options[i].style, text:q.options[i].t}});
      if(idx+1 < DIAG_QUESTIONS.length){
        renderDiagQuestion(idx+1, newAnswers);
      } else {
        finishDiagnostic(newAnswers);
      }
    });
  });
}

function finishDiagnostic(answers){
  const tally = {competir:0,colaborar:0,comprometer:0,evitar:0,ceder:0};
  Object.values(answers).forEach(a=> tally[a.style]++ );
  let dominant = Object.keys(tally).reduce((a,b)=> tally[a]>=tally[b]?a:b );
  const detail = DIAG_QUESTIONS.map((q,i)=>({ question:q.q, chosenText:answers[i].text, style:answers[i].style }));
  state.m0Result = { tally, dominant, detail };
  markCompleted(0);
  saveState();
  document.getElementById("view-0").innerHTML = module0ResultHTML(state.m0Result);
  attachM0ResultEvents();
  renderNav();
}

function module0ResultHTML(result){
  const total = DIAG_QUESTIONS.length;
  const style = STYLES[result.dominant];
  const order = ["colaborar","comprometer","competir","ceder","evitar"];
  return `
    <div class="module-eyebrow">Módulo 0 · Resultado</div>
    <h1 class="module-title">Tu perfil frente al conflicto</h1>
    <p class="module-intro">Este resultado refleja tu tendencia habitual, no una etiqueta fija. Podés desarrollar cualquiera de los cinco estilos con práctica.</p>
    <div class="card">
      <div class="result-style-card">
        <div class="rs-label">Estilo dominante</div>
        <h3>${style.name}</h3>
        <p>${style.desc}</p>
      </div>
      <div class="style-bars">
        ${order.map(k=>`
          <div class="style-bar-row">
            <div class="style-bar-name">${STYLES[k].short}</div>
            <div class="style-bar-track"><div class="style-bar-fill" data-val="${Math.round((result.tally[k]/total)*100)}" style="background:linear-gradient(90deg, ${STYLES[k].color}99, ${STYLES[k].color})"></div></div>
            <div class="style-bar-val">${result.tally[k]}/${total}</div>
          </div>
        `).join("")}
      </div>
      <div class="result-grid">
        <div class="result-col">
          <h4>💪 Fortalezas de tu estilo</h4>
          <ul>${style.strengths.map(s=>`<li>${s}</li>`).join("")}</ul>
        </div>
        <div class="result-col">
          <h4>🎯 Puntos clave a mejorar</h4>
          <ul>${style.improve.map(s=>`<li>${s}</li>`).join("")}</ul>
        </div>
      </div>
    </div>
    <div class="next-cta">
      <button class="btn btn-primary" id="m0NextBtn">Continuar al Módulo 1 →</button>
    </div>
  `;
}

function attachM0ResultEvents(){
  const btn = document.getElementById("m0NextBtn");
  if(btn) btn.addEventListener("click", ()=> goTo(1));
  requestAnimationFrame(()=>{
    document.querySelectorAll(".style-bar-fill").forEach(f=>{ f.style.width = f.dataset.val + "%"; });
  });
}

/* ============================= RENDER: MODULES 1-4 ============================= */

function renderModule(id){
  const data = MODULES[id];
  const el = document.getElementById("view-"+id);
  const done = isCompleted(id);
  el.innerHTML = `
    <div class="module-eyebrow">${data.eyebrow}</div>
    <h1 class="module-title">${data.title}</h1>
    <p class="module-intro">${data.intro}</p>

    <div class="card">
      <div class="section-label">Conceptos clave</div>
      <div class="tabbar" id="tabbar-${id}"></div>
      <div id="tabpanels-${id}"></div>
    </div>

    <div class="card">
      <div class="section-label">Caso práctico</div>
      <div class="case-box">
        <span class="case-tag">${data.case.tag}</span>
        ${data.case.body.map(p=>`<p>${p}</p>`).join("")}
      </div>
    </div>

    <div class="card">
      <div class="section-label">Evaluación</div>
      <div id="quizhost-${id}"></div>
    </div>
  `;
  renderTabs(id, data.concepts);
  renderQuiz(id, data.quiz);
}

function renderTabs(id, concepts){
  const bar = document.getElementById("tabbar-"+id);
  const panels = document.getElementById("tabpanels-"+id);
  bar.innerHTML = concepts.map((c,i)=>`<button class="tabbtn ${i===0?'active':''}" data-i="${i}">${c.t}</button>`).join("");
  panels.innerHTML = concepts.map((c,i)=>`
    <div class="tabpanel ${i===0?'active':''}" data-panel="${i}">
      <h4>${c.t}</h4>
      <p>${c.body}</p>
      <ul>${c.list.map(li=>`<li>${li}</li>`).join("")}</ul>
    </div>
  `).join("");
  bar.querySelectorAll(".tabbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      bar.querySelectorAll(".tabbtn").forEach(b=>b.classList.remove("active"));
      panels.querySelectorAll(".tabpanel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      panels.querySelector(`[data-panel="${btn.dataset.i}"]`).classList.add("active");
    });
  });
}

/* ---- Quiz engine (shared by modules 1-4) ---- */
function renderQuiz(id, questions){
  const host = document.getElementById("quizhost-"+id);
  let qState = state.quizState[id] || { idx:0, correctCount:0, results:[], chosen:[] };
  if(!qState.chosen) qState.chosen = [];

  if(isCompleted(id) && qState.results.length === questions.length){
    host.innerHTML = quizSummaryHTML(id, questions.length, qState.correctCount, true);
    attachSummaryEvents(id);
    return;
  }

  drawQuestion();

  function drawQuestion(){
    const i = qState.idx;
    if(i >= questions.length){
      host.innerHTML = quizSummaryHTML(id, questions.length, qState.correctCount, false);
      attachSummaryEvents(id);
      return;
    }
    const q = questions[i];
    host.innerHTML = `
      <div class="quiz-progress">
        ${questions.map((_,k)=>{
          let cls = "";
          if(k < qState.results.length) cls = qState.results[k] ? "done" : "wrong";
          else if(k===i) cls = "current";
          return `<div class="quiz-dot ${cls}"></div>`;
        }).join("")}
      </div>
      <div class="q-count">Pregunta ${i+1} de ${questions.length}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="qOptions">
        ${q.opts.map((o,k)=>`<button class="option" data-i="${k}"><span class="opt-letter">${String.fromCharCode(97+k)}</span><span>${o}</span></button>`).join("")}
      </div>
      <div class="feedback" id="qFeedback"></div>
      <div class="quiz-actions">
        <button class="btn btn-primary" id="qNextBtn" disabled>Siguiente</button>
      </div>
    `;
    const optsWrap = document.getElementById("qOptions");
    const nextBtn = document.getElementById("qNextBtn");
    const fb = document.getElementById("qFeedback");
    let answered = false;

    optsWrap.querySelectorAll(".option").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(answered) return;
        answered = true;
        const chosen = parseInt(btn.dataset.i,10);
        const isRight = chosen === q.correct;
        optsWrap.querySelectorAll(".option").forEach((b,k)=>{
          b.disabled = true;
          if(k===q.correct) b.classList.add("correct");
          else if(k===chosen) b.classList.add("incorrect");
        });
        fb.className = "feedback show " + (isRight ? "ok" : "bad");
        fb.innerHTML = `<span class="fb-icon">${isRight ? "✅" : "❌"}</span><span>${q.exp[chosen]}</span>`;
        nextBtn.disabled = false;
        qState.results[i] = isRight;
        qState.chosen[i] = chosen;
        qState.correctCount = qState.results.filter(Boolean).length;
        state.quizState[id] = qState;
        saveState();
      });
    });

    nextBtn.addEventListener("click", ()=>{
      qState.idx = i+1;
      state.quizState[id] = qState;
      saveState();
      drawQuestion();
    });
  }
}

function quizSummaryHTML(id, total, correct, alreadyDone){
  const pct = Math.round((correct/total)*100);
  const passed = pct >= 60;
  return `
    <div class="quiz-result">
      <div class="q-count" style="font-size:.8rem;">Resultado</div>
      <h3>${correct} de ${total} correctas (${pct}%)</h3>
      <p>${passed
        ? "¡Buen trabajo! Superaste el umbral de aprobación y desbloqueaste el siguiente módulo."
        : "Necesitás al menos 60% de respuestas correctas para desbloquear el siguiente módulo. Podés repasar los conceptos e intentarlo de nuevo."}</p>
      ${passed
        ? `<button class="btn btn-primary" id="unlockNextBtn">${id<4 ? "Ir al Módulo "+(id+1)+" →" : "Ver cierre del curso →"}</button>`
        : `<button class="btn btn-amber" id="retryQuizBtn">Reintentar evaluación</button>`
      }
    </div>
  `;
}

function attachSummaryEvents(id){
  const unlockBtn = document.getElementById("unlockNextBtn");
  const retryBtn = document.getElementById("retryQuizBtn");
  if(unlockBtn){
    unlockBtn.addEventListener("click", ()=>{
      markCompleted(id);
      renderNav();
      if(id < 4){ renderModule(id+1); goTo(id+1); }
      else { renderFinish(); goTo(4); }
    });
  }
  if(retryBtn){
    retryBtn.addEventListener("click", ()=>{
      state.quizState[id] = { idx:0, correctCount:0, results:[] };
      saveState();
      renderModule(id);
    });
  }
}

function renderFinish(){
  const el = document.getElementById("view-4");
  if(!el.querySelector(".finish-banner")){
    el.insertAdjacentHTML("beforeend", `
      <div class="finish-banner">
        <h3>🏁 Completaste el programa</h3>
        <p>Recorriste tu autodiagnóstico y los cuatro módulos de contenido. Tu estilo dominante fue <strong>${state.m0Result ? STYLES[state.m0Result.dominant].name : "—"}</strong>. Volvé a este espacio cuando quieras repasar cualquier módulo desde el menú.</p>
        <button class="btn btn-ghost" id="reviewBtn">Revisar Módulo 0</button>
      </div>
    `);
    const rb = document.getElementById("reviewBtn");
    if(rb) rb.addEventListener("click", ()=> goTo(0));
  }
}

/* ============================= LOCKED VIEW ============================= */

function renderLocked(id){
  const meta = NAV_META[id];
  const el = document.getElementById("view-"+id);
  el.innerHTML = `
    <div class="module-eyebrow">${meta.label}</div>
    <h1 class="module-title">Módulo bloqueado</h1>
    <div class="locked-notice">
      ${lockIcon()}
      <div>Completá y aprobá el módulo anterior para desbloquear <strong>${meta.label}</strong>.</div>
    </div>
  `;
}

/* ============================= INIT / RENDER ALL ============================= */

function renderAll(){
  renderNav();
  renderModule0();
  [1,2,3,4].forEach(id=>{
    if(isUnlocked(id)) renderModule(id);
    else renderLocked(id);
  });
  if(isCompleted(4)) renderFinish();
  const target = state.completed.length < 5 ? findFirstIncomplete() : 4;
  goTo(target);
}

function findFirstIncomplete(){
  for(let i=0;i<5;i++){ if(!isCompleted(i)) return i; }
  return 4;
}

/* ============================= MOBILE NAV ============================= */

const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("sidebarBackdrop");
const hamburgerBtn = document.getElementById("hamburgerBtn");
hamburgerBtn.setAttribute("aria-expanded", "false");
hamburgerBtn.addEventListener("click", ()=>{
  sidebar.classList.add("open");
  backdrop.classList.add("show");
  hamburgerBtn.setAttribute("aria-expanded", "true");
  document.body.style.overflow = "hidden";
});
backdrop.addEventListener("click", closeSidebarMobile);
function closeSidebarMobile(){
  sidebar.classList.remove("open");
  backdrop.classList.remove("show");
  hamburgerBtn.setAttribute("aria-expanded", "false");
  document.body.style.overflow = "";
}

/* ============================= RESET ============================= */

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("¿Seguro que querés borrar todo tu progreso? Esta acción no se puede deshacer.")){
    localStorage.removeItem(STORAGE_KEY);
    state = { completed:[], m0Result:null, quizState:{} };
    renderAll();
  }
});

/* ============================= PDF REPORT (DESCARGA) ============================= */

const LOGO_SRC = document.querySelector(".org-logo-strip img") ? document.querySelector(".org-logo-strip img").src : "";

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function buildDiagnosticSection(){
  if(!state.m0Result){
    return `<div class="pdf-section"><h2>Módulo 0 · Autodiagnóstico Inicial</h2><p class="pdf-empty">Aún no se completó el autodiagnóstico.</p></div>`;
  }
  const total = DIAG_QUESTIONS.length;
  const style = STYLES[state.m0Result.dominant];
  const order = ["colaborar","comprometer","competir","ceder","evitar"];
  const bars = order.map(k=>{
    const val = Math.round((state.m0Result.tally[k]/total)*100);
    return `<div class="pdf-bar-row">
      <div class="pdf-bar-name">${STYLES[k].short}</div>
      <div class="pdf-bar-track"><div class="pdf-bar-fill" style="width:${val}%; background:${STYLES[k].color}"></div></div>
      <div class="pdf-bar-val">${state.m0Result.tally[k]}/${total}</div>
    </div>`;
  }).join("");
  const detailRows = (state.m0Result.detail || []).map((d,i)=>`
    <div class="pdf-qblock">
      <div class="pdf-qtext">${i+1}. ${escapeHTML(d.question)}</div>
      <div class="pdf-row">Respuesta elegida: ${escapeHTML(d.chosenText)}</div>
      <div class="pdf-row">Estilo asociado: ${STYLES[d.style].short}</div>
    </div>
  `).join("");
  return `
    <div class="pdf-section">
      <h2>Módulo 0 · Autodiagnóstico Inicial</h2>
      <p class="pdf-meta"><strong>Estilo dominante:</strong> ${style.name}</p>
      <p class="pdf-meta">${style.desc}</p>
      <div class="pdf-bars">${bars}</div>
      <h3>Fortalezas de tu estilo</h3>
      <ul>${style.strengths.map(s=>`<li>${escapeHTML(s)}</li>`).join("")}</ul>
      <h3>Puntos clave a mejorar</h3>
      <ul>${style.improve.map(s=>`<li>${escapeHTML(s)}</li>`).join("")}</ul>
      <h3>Detalle de respuestas</h3>
      ${detailRows}
    </div>
  `;
}

function buildModuleSection(id){
  const data = MODULES[id];
  const qState = state.quizState[id];
  if(!qState || !qState.results || qState.results.length < data.quiz.length){
    return `<div class="pdf-section"><h2>${data.eyebrow} · ${data.title}</h2><p class="pdf-empty">Evaluación aún no completada.</p></div>`;
  }
  const correct = qState.results.filter(Boolean).length;
  const total = data.quiz.length;
  const pct = Math.round((correct/total)*100);
  const passed = pct >= 60;
  const qRows = data.quiz.map((q,i)=>{
    const chosenIdx = qState.chosen ? qState.chosen[i] : undefined;
    const isRight = qState.results[i];
    const chosenText = (chosenIdx !== undefined && q.opts[chosenIdx] !== undefined) ? q.opts[chosenIdx] : "—";
    const correctText = q.opts[q.correct];
    return `
      <div class="pdf-qblock">
        <div class="pdf-qtext">${i+1}. ${escapeHTML(q.q)}</div>
        <div class="pdf-row ${isRight?'ok':'bad'}">Tu respuesta: ${escapeHTML(chosenText)} ${isRight ? "(correcta)" : "(incorrecta)"}</div>
        ${!isRight ? `<div class="pdf-row ok">Respuesta correcta: ${escapeHTML(correctText)}</div>` : ``}
        <div class="pdf-row">Retroalimentación: ${escapeHTML(q.exp[chosenIdx !== undefined ? chosenIdx : q.correct])}</div>
      </div>
    `;
  }).join("");
  return `
    <div class="pdf-section">
      <h2>${data.eyebrow} · ${data.title} <span class="pdf-badge ${passed?'pass':'fail'}">${correct}/${total} (${pct}%) · ${passed ? "Aprobado" : "No aprobado aún"}</span></h2>
      ${qRows}
    </div>
  `;
}

function buildPrintReport(){
  const now = new Date();
  const fecha = now.toLocaleDateString("es-AR", {day:"2-digit", month:"2-digit", year:"numeric"});
  const hora = now.toLocaleTimeString("es-AR", {hour:"2-digit", minute:"2-digit"});
  const html = `
    <div class="pdf-header">
      ${LOGO_SRC ? `<img src="${LOGO_SRC}" alt="CPIC">` : ``}
      <div>
        <div class="pdf-htitle">Brújula del Conflicto · Reporte de Resultados</div>
        <div class="pdf-hsub">Generado el ${fecha} a las ${hora}</div>
      </div>
    </div>
    ${buildDiagnosticSection()}
    ${[1,2,3,4].map(id=> buildModuleSection(id)).join("")}
  `;
  document.getElementById("printArea").innerHTML = html;
}

document.getElementById("downloadBtn").addEventListener("click", ()=>{
  buildPrintReport();
  window.print();
});
