<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Máster Autónomo: Pensamiento Crítico y Resolución de Problemas</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#0f172a;
    --slate:#334155;
    --indigo:#4f46e5;
    --indigo-deep:#3730a3;
    --green:#059669;
    --amber:#d97706;
    --paper:#eaf7df;
    --cpic-green:#00704a;
    --cpic-green-dark:#005c3d;
    --cpic-gray:#c6c1bb;
  }
  html{scroll-behavior:smooth;}
  body{background:var(--paper); font-family:'Segoe UI',ui-sans-serif,system-ui,sans-serif; color:var(--ink);}
  .font-display{font-family:'Georgia','Times New Roman',serif;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .progress-fill{transition:width .6s cubic-bezier(.4,0,.2,1);}
  .accordion-body{max-height:0; overflow:hidden; transition:max-height .35s ease;}
  .accordion-body.open{max-height:800px;}
  .accordion-chevron{transition:transform .3s ease;}
  .accordion-chevron.open{transform:rotate(180deg);}
  .tab-btn{position:relative;}
  .tab-btn.active-cpic{background:var(--cpic-green); color:#fff;}
  .tab-btn.locked{opacity:.6; cursor:not-allowed;}
  .quiz-option{transition:all .15s ease;}
  .quiz-option:hover:not(.disabled){border-color:var(--indigo); background:#eef2ff;}
  .quiz-option.correct{background:#ecfdf5; border-color:var(--green); color:#065f46;}
  .quiz-option.incorrect{background:#fef2f2; border-color:#dc2626; color:#991b1b;}
  .badge-pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes pop{0%{transform:scale(0.3); opacity:0;} 70%{transform:scale(1.1);} 100%{transform:scale(1); opacity:1;}}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1; border-radius:4px;}
  .focus-ring:focus-visible{outline:3px solid var(--indigo); outline-offset:2px;}
  .diag-bar{height:10px; border-radius:9999px; background:#e2e8f0; overflow:hidden;}
  .diag-bar-fill{height:100%; border-radius:9999px;}
  .print-only{display:none;}
  @media print{
    .no-print{display:none !important;}
    .print-only{display:block !important;}
    body{background:#fff;}
  }
</style>
</head>
<body class="min-h-screen">

<!-- ===================== HEADER / DASHBOARD ===================== -->
<header class="no-print sticky top-0 z-40 bg-slate-900 text-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-white rounded-xl p-1.5 shrink-0 shadow-sm">
          <img id="header-logo" alt="Logo Consejo Profesional de Ingeniería Civil" class="h-9 w-auto object-contain">
        </div>
        <div>
          <h1 class="font-display text-lg sm:text-xl font-bold leading-tight">Máster Autónomo: Pensamiento Crítico y Resolución de Problemas</h1>
          <p class="text-xs text-slate-400">Capacitación interactiva de autoaprendizaje</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 bg-slate-800/70 px-3 py-1.5 rounded-full">
          <i data-lucide="award" class="w-4 h-4 text-amber-400"></i>
          <span id="points-display" class="text-sm font-semibold">0 pts</span>
          <span class="text-slate-500">|</span>
          <span id="badges-display" class="text-sm">0 insignias</span>
        </div>
        <button onclick="resetProgress()" class="no-print flex items-center gap-1.5 text-xs sm:text-sm bg-slate-800 hover:bg-red-600 transition-colors px-3 py-2 rounded-lg focus-ring" aria-label="Reiniciar progreso">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reiniciar
        </button>
      </div>
    </div>
    <div class="mt-4">
      <div class="flex justify-between text-xs text-slate-400 mb-1">
        <span>Progreso general del máster</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
        <div id="progress-bar" class="progress-fill h-full rounded-full bg-gradient-to-r from-indigo-500 to-emerald-400" style="width:0%"></div>
      </div>
    </div>
  </div>
</header>

<!-- ===================== MAIN LAYOUT ===================== -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex flex-col lg:flex-row gap-6">

  <!-- SIDEBAR NAV -->
  <nav class="no-print lg:w-72 shrink-0" aria-label="Navegación de módulos">
    <div class="rounded-2xl shadow-sm p-3 sticky top-32 space-y-1.5" style="background:var(--cpic-gray);" id="sidebar-nav"></div>
  </nav>

  <!-- CONTENT -->
  <main id="app-content" class="flex-1 min-w-0 fade-in"></main>
</div>

<footer class="no-print text-center text-xs text-slate-400 py-8">
  Máster Autónomo &middot; Pensamiento Crítico y Resolución de Problemas
</footer>

const STORAGE_KEY = 'ccApp_state_v1';

function defaultState(){
  return {
    currentTab: 'diag',
    userName: '',
    diagnostic: { completed:false, answers:[null,null,null,null,null,null], style:null },
    modules: {
      m1: { unlocked:false, completed:false, bestScore:0, attempts:0 },
      m2: { unlocked:false, completed:false, bestScore:0, attempts:0 },
      m3: { unlocked:false, completed:false, bestScore:0, attempts:0 },
      m4: { unlocked:false, completed:false, bestScore:0, attempts:0 }
    },
    points: 0,
    badges: []
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {
      modules: Object.assign(defaultState().modules, parsed.modules || {})
    });
  }catch(e){
    return defaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    // Si el navegador bloquea localStorage (ej. Firefox con el archivo abierto vía file://,
    // modo privado, o cuotas de almacenamiento), no debe romperse el resto de la app:
    // seguimos funcionando en memoria para esta sesión y solo avisamos una vez en consola.
    if(!saveState._warned){
      console.warn('No se pudo guardar el progreso en este navegador (localStorage no disponible). La app seguirá funcionando, pero el progreso no persistirá al recargar la página.', e);
      saveState._warned = true;
    }
  }
}

function resetProgress(){
  if(!confirm('¿Seguro que querés reiniciar todo tu progreso? Esta acción no se puede deshacer.')) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){ /* ver nota en saveState() */ }
  state = defaultState();
  Object.keys(quizState).forEach(k => delete quizState[k]); // limpia también el estado en memoria de los quizzes
  render();
}

========================================================================= */
function computeOverallProgress(){
  const totalSteps = 5; // diagnóstico + 4 módulos
  let done = 0;
  if(state.diagnostic.completed) done++;
  ['m1','m2','m3','m4'].forEach(m => { if(state.modules[m].completed) done++; });
  return Math.round((done/totalSteps)*100);
}

function updateHeader(){
  const pct = computeOverallProgress();
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('points-display').textContent = state.points + ' pts';
  document.getElementById('badges-display').textContent = state.badges.length + ' insignia' + (state.badges.length===1?'':'s');
}

const navItems = [
  { id:'diag', label:'Módulo 0 · Autodiagnóstico', icon:'compass' },
  { id:'m1', label:'Módulo 1 · Sesgos y Premisas', icon:'eye' },

function isUnlocked(id){
  if(id === 'diag') return true;
  if(id === 'cert') return state.modules.m4.completed;
  return state.modules[id] ? state.modules[id].unlocked : false;
}
function isCompleted(id){
  if(id === 'diag') return state.diagnostic.completed;
  if(id === 'cert') return state.modules.m4.completed;
  return state.modules[id] ? state.modules[id].completed : false;
}

function renderSidebar(){
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = navItems.map(item => {
    const unlocked = isUnlocked(item.id);
    const completed = isCompleted(item.id);
    const active = state.currentTab === item.id;
    return `
      <button
        onclick="goTo('${item.id}')"
        class="tab-btn w-full flex items-center gap-3 text-left px-3 py-2.5 rounded-xl text-sm font-medium border border-transparent
          ${active ? 'active-cpic shadow-md' : unlocked ? 'text-slate-700 hover:bg-black/5' : 'text-slate-400 locked'}"
        ${unlocked ? '' : 'aria-disabled="true"'}
      >
        <i data-lucide="${unlocked ? item.icon : 'lock'}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1">${item.label}</span>
        ${completed ? `<i data-lucide="badge-check" class="w-4 h-4 shrink-0 ${active ? 'text-white' : 'text-emerald-700'}"></i>` : ''}
      </button>`;
  }).join('') + `
    <div class="pt-2 mt-1.5 border-t border-black/10">
      <button id="download-pdf-btn" onclick="generateResultsPDF()" class="focus-ring w-full flex items-center justify-center gap-2 text-sm font-semibold text-white hover:brightness-110 px-3 py-2.5 rounded-xl transition-all" style="background:var(--cpic-green);">
        <i data-lucide="file-down" class="w-4 h-4"></i> Descargar resultados (PDF)
      </button>
    </div>`;
  lucide.createIcons();
}

function goTo(id){
  if(!isUnlocked(id)){
    flashLockedMessage(id);
    return;
  }
  state.currentTab = id;
  saveState();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function flashLockedMessage(id){
  const el = document.getElementById('locked-toast');
  if(el) el.remove();
  const toast = document.createElement('div');
  toast.id = 'locked-toast';
  toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-xl text-sm z-50 fade-in';
  toast.textContent = 'Completá el paso anterior para desbloquear esta sección.';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2200);
}

/* =========================================================================

========================================================================= */
function render(){
  updateHeader();
  renderSidebar();
  const c = document.getElementById('app-content');
  c.classList.remove('fade-in'); void c.offsetWidth; c.classList.add('fade-in');

  switch(state.currentTab){
    case 'diag': c.innerHTML = renderDiagTab(); break;
    case 'm1': c.innerHTML = renderModuleShell('m1'); break;
    case 'm2': c.innerHTML = renderModuleShell('m2'); break;
    case 'm3': c.innerHTML = renderModuleShell('m3'); break;
    case 'm4': c.innerHTML = renderModuleShell('m4'); break;
    case 'cert': c.innerHTML = renderCertificate(); break;
    default: c.innerHTML = renderDiagTab();
  }
  lucide.createIcons();
  postRenderHooks();
}

function setDiagAnswer(qi, val){
  state.diagnostic.answers[qi] = val;
  saveState();
  const btn = document.getElementById('diag-submit-btn');
  if(btn) btn.disabled = state.diagnostic.answers.includes(null);
}

function submitDiagnostic(){
  if(state.diagnostic.answers.includes(null)) return;
  const tally = {R:0, A:0, E:0, I:0};
  state.diagnostic.answers.forEach(s => tally[s]++);
  let best = 'I', bestCount = -1;
  ['I','A','R','E'].forEach(k => { if(tally[k] > bestCount){ bestCount = tally[k]; best = k; } });
  state.diagnostic.style = best;
  state.diagnostic.tally = tally;
  state.diagnostic.completed = true;
  awardBadge('Autodiagnóstico completado', 20);
  state.modules.m1.unlocked = true;
  saveState();
  render();
}

function renderMatrix(){
  const container = document.getElementById('matrix-container');
  if(!container) return;
  const data = getMatrixData();
  const weightSum = data.criteria.reduce((a,c)=>a+Number(c.weight),0);

  const results = data.alternatives.map(alt => {
    const total = alt.scores.reduce((sum, s, i) => sum + (Number(s) * Number(data.criteria[i].weight)/100), 0);
    return { name: alt.name, total: Math.round(total*10)/10 };
  });
  const maxTotal = Math.max(...results.map(r=>r.total));

  container.innerHTML = `
    <table class="w-full text-sm border-collapse min-w-[560px]">
      <thead>
        <tr>
          <th class="text-left p-2 border-b border-slate-200">Alternativa</th>
          ${data.criteria.map((c,ci) => `
            <th class="text-left p-2 border-b border-slate-200">
              <input value="${c.name}" onchange="updateCriterionName(${ci}, this.value)" class="focus-ring w-24 font-semibold text-xs border-b border-dashed border-slate-300 bg-transparent">
              <div class="flex items-center gap-1 mt-1">
                <input type="number" min="0" max="100" value="${c.weight}" onchange="updateCriterionWeight(${ci}, this.value)" class="focus-ring w-14 border border-slate-300 rounded px-1 py-0.5 text-xs">
                <span class="text-slate-400 text-xs">%</span>
              </div>
            </th>`).join('')}
          <th class="text-left p-2 border-b border-slate-200">Puntaje</th>
        </tr>
      </thead>
      <tbody>
        ${data.alternatives.map((alt, ai) => `
          <tr class="${results[ai].total === maxTotal ? 'bg-emerald-50' : ''}">
            <td class="p-2 border-b border-slate-100">
              <input value="${alt.name}" onchange="updateAltName(${ai}, this.value)" class="focus-ring border-b border-dashed border-slate-300 bg-transparent text-sm">
            </td>
            ${alt.scores.map((s,ci) => `
              <td class="p-2 border-b border-slate-100">
                <input type="number" min="1" max="5" value="${s}" onchange="updateAltScore(${ai},${ci},this.value)" class="focus-ring w-14 border border-slate-300 rounded px-1 py-1 text-xs text-center">
              </td>`).join('')}
            <td class="p-2 border-b border-slate-100 font-bold ${results[ai].total===maxTotal?'text-emerald-700':'text-slate-700'}">
              ${results[ai].total} ${results[ai].total===maxTotal?'<i data-lucide="crown" class="inline w-4 h-4 text-amber-500"></i>':''}
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    <p class="text-xs mt-3 ${weightSum===100?'text-emerald-600':'text-amber-600'}">
      Suma de pesos: ${weightSum}% ${weightSum===100 ? '(correcto)' : '(debería sumar 100% para un resultado preciso)'}
    </p>
  `;
  lucide.createIcons();
}
function updateCriterionName(i,val){ getMatrixData().criteria[i].name = val; saveState(); }
function updateCriterionWeight(i,val){ getMatrixData().criteria[i].weight = Number(val)||0; saveState(); renderMatrix(); }
function updateAltName(i,val){ getMatrixData().alternatives[i].name = val; saveState(); }
function updateAltScore(ai,ci,val){ getMatrixData().alternatives[ai].scores[ci] = Number(val)||1; saveState(); renderMatrix(); }

function answerCase(mod, idx, correctIdx){
  const options = document.querySelectorAll(`#case-${mod}-options .quiz-option`);
  options.forEach((btn,i) => {
    btn.classList.add('disabled');
    btn.style.pointerEvents = 'none';
    if(i === correctIdx) btn.classList.add('correct');

========================================================================= */
const quizState = {}; // { m1: { answers:[...], submitted:false } }

function initQuizState(id){
  if(!quizState[id]){
    quizState[id] = { answers: new Array(quizzes[id].length).fill(null), submitted:false };
  }
}

function renderQuiz(id){
  initQuizState(id);
  const container = document.getElementById('quiz-'+id);
  if(!container) return;
  const qs = quizzes[id];
  const qState = quizState[id];

  container.innerHTML = qs.map((q, qi) => `
    <div class="mb-6 pb-6 ${qi < qs.length-1 ? 'border-b border-slate-100' : ''}">
      <p class="font-medium text-sm mb-3">${qi+1}. ${q.q}</p>
      <div class="space-y-2">
        ${q.opts.map((opt, oi) => {
          let cls = 'quiz-option';
          if(qState.submitted){
            cls += ' disabled';
            if(oi === q.correct) cls += ' correct';
            else if(oi === qState.answers[qi]) cls += ' incorrect';
          } else if(qState.answers[qi] === oi){
            cls += ' border-indigo-500 bg-indigo-50';
          }
          return `<button ${qState.submitted?'style="pointer-events:none"':''} onclick="selectQuizAnswer('${id}',${qi},${oi})" class="${cls} w-full text-left text-sm border border-slate-200 rounded-lg px-4 py-3">${opt}</button>`;
        }).join('')}
      </div>
      ${qState.submitted ? `<p class="text-xs mt-2 p-3 rounded-lg ${qState.answers[qi]===q.correct?'bg-emerald-50 text-emerald-800':'bg-amber-50 text-amber-800'}"><i data-lucide="info" class="inline w-3.5 h-3.5 mr-1"></i>${q.explain}</p>` : ''}
    </div>
  `).join('') + renderQuizFooter(id);

  lucide.createIcons();
}

function renderQuizFooter(id){
  const qState = quizState[id];
  const allAnswered = qState.answers.every(a => a !== null);
  if(!qState.submitted){
    return `<button onclick="submitQuiz('${id}')" class="focus-ring inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-semibold px-5 py-3 rounded-xl" ${allAnswered?'':'disabled'}>
      <i data-lucide="send" class="w-4 h-4"></i> Corregir evaluación
    </button>`;
  }
  const correctCount = quizzes[id].filter((q,i) => qState.answers[i]===q.correct).length;
  const pct = Math.round((correctCount/quizzes[id].length)*100);
  const passed = pct >= 70;
  return `
    <div class="mt-2 p-5 rounded-xl border ${passed?'bg-emerald-50 border-emerald-300':'bg-red-50 border-red-300'}">
      <div class="flex items-center gap-3">
        <i data-lucide="${passed?'trophy':'refresh-cw'}" class="w-8 h-8 ${passed?'text-emerald-600':'text-red-500'}"></i>
        <div>
          <p class="font-bold text-lg ${passed?'text-emerald-800':'text-red-700'}">${pct}% de aciertos</p>
          <p class="text-sm ${passed?'text-emerald-700':'text-red-600'}">${passed ? '¡Aprobaste! Módulo completado.' : 'Necesitás al menos 70% para aprobar. Podés reintentar.'}</p>
        </div>
      </div>
      <div class="flex gap-2 mt-4">
        <button onclick="retryQuiz('${id}')" class="focus-ring inline-flex items-center gap-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold px-4 py-2.5 rounded-xl text-sm">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reintentar
        </button>
        ${passed && nextModuleId(id) ? `<button onclick="goTo('${nextModuleId(id)}')" class="focus-ring inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2.5 rounded-xl text-sm">Continuar <i data-lucide="arrow-right" class="w-4 h-4"></i></button>` : ''}
        ${passed && !nextModuleId(id) ? `<button onclick="goTo('cert')" class="focus-ring inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2.5 rounded-xl text-sm">Ver certificado <i data-lucide="graduation-cap" class="w-4 h-4"></i></button>` : ''}
      </div>
    </div>`;
}

function nextModuleId(id){
  const order = ['m1','m2','m3','m4'];
  const idx = order.indexOf(id);
  return idx >= 0 && idx < order.length-1 ? order[idx+1] : null;
}

function selectQuizAnswer(id, qi, oi){
  const qState = quizState[id];
  if(qState.submitted) return;
  qState.answers[qi] = oi;
  renderQuiz(id);
}

function submitQuiz(id){
  const qState = quizState[id];
  if(qState.answers.includes(null)) return;
  qState.submitted = true;
  const correctCount = quizzes[id].filter((q,i) => qState.answers[i]===q.correct).length;
  const pct = Math.round((correctCount/quizzes[id].length)*100);
  const mod = state.modules[id];
  mod.attempts += 1;
  mod.bestScore = Math.max(mod.bestScore, pct);
  if(pct >= 70 && !mod.completed){
    mod.completed = true;
    awardBadge(moduleNames[id], 30);
    const next = nextModuleId(id);
    if(next) state.modules[next].unlocked = true;
  } else if(pct >= 70){
    mod.completed = true;
  }
  saveState();
  updateHeader();
  renderSidebar();
  renderQuiz(id);
}

function retryQuiz(id){
  quizState[id] = { answers: new Array(quizzes[id].length).fill(null), submitted:false };
  renderQuiz(id);
}

}

function reportModule3Tool(){
  const m = state.matrix;
  if(!m){
    return '<p style="font-size:11px;color:#94a3b8;margin:0 0 10px;">Herramienta no completada.</p>';
  }
  const results = m.alternatives.map(alt => {
    const total = alt.scores.reduce((sum, s, i) => sum + (Number(s) * Number(m.criteria[i].weight)/100), 0);
    return { name: alt.name, total: Math.round(total*10)/10 };
  });
  const maxTotal = Math.max(...results.map(r=>r.total));
  let html = `<table style="width:100%;border-collapse:collapse;font-size:11px;margin:0 0 10px;">
    <thead><tr>
      <th style="text-align:left;padding:4px;border-bottom:1px solid #cbd5e1;">Alternativa</th>
      ${m.criteria.map(c=>`<th style="text-align:left;padding:4px;border-bottom:1px solid #cbd5e1;">${c.name} (${c.weight}%)</th>`).join('')}
      <th style="text-align:left;padding:4px;border-bottom:1px solid #cbd5e1;">Puntaje</th>
    </tr></thead><tbody>`;
  m.alternatives.forEach((alt, ai) => {
    const isBest = results[ai].total === maxTotal;
    html += `<tr style="${isBest ? 'background:#ecfdf5;' : ''}">
      <td style="padding:4px;border-bottom:1px solid #f1f5f9;">${alt.name}</td>
      ${alt.scores.map(s=>`<td style="padding:4px;border-bottom:1px solid #f1f5f9;">${s}</td>`).join('')}
      <td style="padding:4px;border-bottom:1px solid #f1f5f9;font-weight:700;${isBest?'color:#059669;':''}">${results[ai].total}${isBest?' &#9733;':''}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  return html;
}

function reportQuizDetail(id){
  const mod = state.modules[id];
  const qS = quizState[id];
  let html = `<p style="margin:0 0 8px;font-size:11.5px;color:#475569;">Estado: <strong style="color:${mod.completed?'#059669':'#dc2626'};">${mod.completed?'Completado':'No completado'}</strong> &nbsp;|&nbsp; Mejor puntaje: <strong>${mod.bestScore}%</strong> &nbsp;|&nbsp; Intentos: ${mod.attempts}</p>`;

  if(qS && qS.submitted){
    html += quizzes[id].map((q,i) => {
      const userIdx = qS.answers[i];
      const isCorrect = userIdx === q.correct;
      return `
        <div style="margin:0 0 8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;">
          <p style="margin:0 0 4px;font-size:11.5px;font-weight:600;color:#0f172a;">${i+1}. ${q.q}</p>
          <p style="margin:0 0 2px;font-size:11px;color:${isCorrect?'#059669':'#dc2626'};">Tu respuesta: ${userIdx!==null?q.opts[userIdx]:'—'} ${isCorrect?'(Correcta)':'(Incorrecta)'}</p>
          ${!isCorrect ? `<p style="margin:0 0 2px;font-size:11px;color:#059669;">Respuesta correcta: ${q.opts[q.correct]}</p>` : ''}
          <p style="margin:0;font-size:10.5px;color:#64748b;">${q.explain}</p>
        </div>`;
    }).join('');
  } else if(mod.completed){
    html += '<p style="font-size:11px;color:#94a3b8;margin:0;">El detalle pregunta por pregunta solo está disponible durante la sesión en la que se rindió el examen. Se muestra el mejor puntaje registrado.</p>';
  } else {
    html += '<p style="font-size:11px;color:#94a3b8;margin:0;">Evaluación aún no rendida.</p>';
  }
  return html;
}

function buildReportElement(){
  const container = document.createElement('div');
  container.id = 'pdf-report-root';
  container.style.cssText = 'position:fixed; left:-9999px; top:0; width:760px; background:#ffffff; padding:32px; font-family:Segoe UI, Arial, sans-serif; color:#0f172a;';
  const today = new Date().toLocaleDateString('es-AR', { year:'numeric', month:'long', day:'numeric' });
  const pct = computeOverallProgress();

  const moduleBlocks = ['m1','m2','m3','m4'].map(id => `
    <div style="border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:16px;">
      <h2 style="margin:0 0 10px;font-size:14px;font-weight:800;color:#3730a3;">${moduleNames[id]}</h2>
      ${id==='m1' ? `<h4 style="margin:0 0 6px;font-size:13px;font-weight:700;color:#4f46e5;">Caso práctico</h4>${reportModule1Tool()}` : ''}
      ${id==='m2' ? reportModule2Tools() : ''}
      ${id==='m3' ? `<h4 style="margin:0 0 6px;font-size:13px;font-weight:700;color:#4f46e5;">Matriz de decisión</h4>${reportModule3Tool()}` : ''}
      <h4 style="margin:10px 0 6px;font-size:13px;font-weight:700;color:#4f46e5;">Evaluación / Quiz</h4>
      ${reportQuizDetail(id)}
    </div>
  `).join('');

  const certBlock = state.modules.m4.completed ? `
    <div style="border:2px dashed #4f46e5;border-radius:10px;padding:16px;text-align:center;margin-bottom:10px;">
      <h2 style="margin:0 0 6px;font-size:15px;font-weight:800;color:#3730a3;">Certificado de finalización</h2>
      <p style="font-size:12px;color:#475569;margin:0;">Promedio general: <strong>${Math.round((['m1','m2','m3','m4'].reduce((s,m)=>s+state.modules[m].bestScore,0))/4)}%</strong></p>
    </div>` : '';

  container.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;border-bottom:3px solid #4f46e5;padding-bottom:12px;margin-bottom:16px;">
      <img src="${LOGO_DATA_URI}" style="height:48px;width:auto;" />
      <div>
        <p style="margin:0;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#64748b;">Informe de resultados</p>
        <h1 style="margin:2px 0 0;font-size:17px;font-weight:800;color:#0f172a;">Máster Autónomo: Pensamiento Crítico y Resolución de Problemas</h1>
      </div>
    </div>
    <p style="font-size:12px;color:#475569;margin:0 0 4px;"><strong>Participante:</strong> ${state.userName || 'No especificado'}</p>
    <p style="font-size:12px;color:#475569;margin:0 0 16px;"><strong>Fecha de generación:</strong> ${today} &nbsp;|&nbsp; <strong>Progreso general:</strong> ${pct}% &nbsp;|&nbsp; <strong>Puntos:</strong> ${state.points} &nbsp;|&nbsp; <strong>Insignias:</strong> ${state.badges.length}</p>

    <div style="border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:16px;">
      <h2 style="margin:0 0 8px;font-size:14px;font-weight:800;color:#3730a3;">Módulo 0 · Autodiagnóstico</h2>
      ${reportDiagnosticHTML()}
    </div>

    ${moduleBlocks}
    ${certBlock}

    <p style="margin-top:16px;font-size:9px;color:#94a3b8;text-align:center;">Consejo Profesional de Ingeniería Civil &middot; Informe generado automáticamente desde el Máster Autónomo de Pensamiento Crítico.</p>
  `;
  return container;
}

async function generateResultsPDF(){
  const btn = document.getElementById('download-pdf-btn');
  if(!btn || btn.disabled) return;
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.classList.add('opacity-70','cursor-wait');
  btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Generando PDF...';
  lucide.createIcons();

  let reportEl = null;
  try{
    if(typeof html2canvas === 'undefined' || !window.jspdf){
      throw new Error('Las librerías de generación de PDF no se cargaron (revisá tu conexión a internet).');
    }
    reportEl = buildReportElement();
    document.body.appendChild(reportEl);

    const canvas = await html2canvas(reportEl, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.95);

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;

    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    const safeName = (state.userName || 'resultados').trim().replace(/[^a-zA-Z0-9 _-]/g,'').replace(/\s+/g,'_') || 'resultados';
    const dateStr = new Date().toISOString().slice(0,10);
    pdf.save(`Resultados_${safeName}_${dateStr}.pdf`);
  }catch(err){
    console.error(err);
    alert('Ocurrió un error al generar el PDF. Probá nuevamente. Detalle: ' + err.message);
  }finally{
    if(reportEl && reportEl.parentNode) reportEl.parentNode.removeChild(reportEl);
    btn.disabled = false;
    btn.classList.remove('opacity-70','cursor-wait');
    btn.innerHTML = originalHTML;
    lucide.createIcons();
  }
}
