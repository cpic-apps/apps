<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Programa de autoaprendizaje de negociación aplicado al ejercicio profesional de la Ingeniería Civil.">
<meta name="color-scheme" content="light dark">
<title>Negociación para Ingenieros Civiles — Programa de autoaprendizaje</title>
<style>
/* ── reset ────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

/* ── tokens ───────────────────────────────────────────── */
:root{
  --paper:#EDEEEA; --surface:#F8F9F6; --surface-2:#E4E6E0; --sunk:#E2E5DE;
  --ink:#141C1A; --ink-2:#3D4A47; --ink-3:#6D7A75;
  --line:#CDD2C9; --line-2:#B3BAB0;
  --accent:#0E5C55; --accent-2:#12746B; --accent-soft:#D4E5E1; --on-accent:#F4F7F4;
  --good:#2E6A4E; --good-soft:#DAE8DE;
  --warn:#8E6A15; --warn-soft:#EDE4C9;
  --crit:#9C382B; --crit-soft:#F0DCD7;
  --display:"Helvetica Neue",Helvetica,"Arial Nova",Arial,sans-serif;
  --body:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --rail:15rem;
  --logo-bg:transparent;
  --shadow:0 1px 2px rgba(20,28,26,.06),0 6px 18px -10px rgba(20,28,26,.22);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0D1312; --surface:#141C1A; --surface-2:#1C2624; --sunk:#0A100F;
    --ink:#E6EAE5; --ink-2:#AEB8B3; --ink-3:#7C8883;
    --line:#283432; --line-2:#3B4A47;
    --accent:#5CC3B2; --accent-2:#7BD6C6; --accent-soft:#15302C; --on-accent:#08201D;
    --good:#63BC90; --good-soft:#152A20;
    --warn:#D3A745; --warn-soft:#2C2413;
    --crit:#E27A66; --crit-soft:#301A16;
    --logo-bg:#F2F4EF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="light"]{
  --paper:#EDEEEA; --surface:#F8F9F6; --surface-2:#E4E6E0; --sunk:#E2E5DE;
  --ink:#141C1A; --ink-2:#3D4A47; --ink-3:#6D7A75;
  --line:#CDD2C9; --line-2:#B3BAB0;
  --accent:#0E5C55; --accent-2:#12746B; --accent-soft:#D4E5E1; --on-accent:#F4F7F4;
  --good:#2E6A4E; --good-soft:#DAE8DE;
  --warn:#8E6A15; --warn-soft:#EDE4C9;
  --crit:#9C382B; --crit-soft:#F0DCD7;
  --logo-bg:transparent;
  --shadow:0 1px 2px rgba(20,28,26,.06),0 6px 18px -10px rgba(20,28,26,.22);
}
:root[data-theme="dark"]{
  --paper:#0D1312; --surface:#141C1A; --surface-2:#1C2624; --sunk:#0A100F;
  --ink:#E6EAE5; --ink-2:#AEB8B3; --ink-3:#7C8883;
  --line:#283432; --line-2:#3B4A47;
  --accent:#5CC3B2; --accent-2:#7BD6C6; --accent-soft:#15302C; --on-accent:#08201D;
  --good:#63BC90; --good-soft:#152A20;
  --warn:#D3A745; --warn-soft:#2C2413;
  --crit:#E27A66; --crit-soft:#301A16;
  --logo-bg:#F2F4EF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}

/* ── base ─────────────────────────────────────────────── */
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
:where(a){color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.lbl{
  font-family:var(--display); font-size:.66rem; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── shell ────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

/* ── riel: elevación estructural ──────────────────────── */
.rail{
  background:var(--surface); border-right:1px solid var(--line);
  padding:1.6rem 0 0; position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:1.5rem;
}
.brand{padding:0 1.25rem;display:flex;flex-direction:column;gap:.95rem}
.logo{
  display:block;width:100%;max-width:10.5rem;height:auto;
  background:var(--logo-bg);padding:.45rem .5rem;border-radius:3px;
}
.brandtxt{display:flex;flex-direction:column;gap:.35rem}
.brand b{
  font-family:var(--display);font-size:1.02rem;font-weight:700;
  letter-spacing:-.015em;line-height:1.2;
}
.brand .lbl{font-size:.6rem}
.railscroll{display:flex;flex-direction:column;gap:1.5rem;flex:1;min-height:0}
.railgrp{display:flex;flex-direction:column;gap:.15rem}
.railgrp > .lbl{padding:0 1.25rem .45rem}

.nav{
  display:flex;align-items:center;gap:.7rem;width:100%;
  padding:.42rem 1.25rem;font-family:var(--display);font-size:.86rem;
  color:var(--ink-2);text-align:left;line-height:1.3;position:relative;
}
.nav:hover{color:var(--ink);background:var(--surface-2)}
.nav[aria-current="true"]{color:var(--ink);font-weight:700;background:var(--accent-soft)}
.nav[aria-current="true"]::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
}
.nav .t{flex:1;min-width:0}

/* montante + nudos */
.spine{position:relative;padding-left:.1rem}
.spine::before{
  content:"";position:absolute;left:calc(1.25rem + 6px);top:1.2rem;bottom:1.2rem;
  width:1px;background:var(--line-2);
}
.joint{
  width:13px;height:13px;flex:none;border-radius:2px;position:relative;z-index:1;
  border:1.5px solid var(--line-2);background:var(--surface);
  display:grid;place-items:center;
}
.nav:hover .joint{border-color:var(--ink-3)}
.joint[data-s="na"]{border:0;background:none}
.joint[data-s="na"]::after{content:"";width:7px;height:1px;background:var(--line-2)}
.joint[data-s="leido"]{border-color:var(--accent);background:linear-gradient(135deg,var(--accent) 50%,var(--surface) 50%)}
.joint[data-s="ok"]{border-color:var(--accent);background:var(--accent)}
.joint[data-s="ok"]::after{
  content:"";width:4px;height:7px;margin-top:-2px;border:solid var(--on-accent);
  border-width:0 1.6px 1.6px 0;transform:rotate(42deg);
}
.nav .mn{font-family:var(--mono);font-size:.68rem;color:var(--ink-3);flex:none}
.nav[aria-current="true"] .mn{color:var(--accent-2)}

.railfoot{
  margin-top:auto;padding:.8rem 1.25rem 1.2rem;display:flex;flex-direction:column;gap:.6rem;
  position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
}
.meter{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.railfoot .row{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.mini{font-family:var(--mono);font-size:.7rem;color:var(--ink-3)}
.ghost{
  font-family:var(--display);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:.3rem .5rem;
}
.ghost:hover{color:var(--ink);border-color:var(--line-2)}

/* ── main ─────────────────────────────────────────────── */
.main{padding:2.6rem 3rem 6rem;max-width:calc(68ch + 6rem);width:100%}
.view{display:none}
.view.on{display:block;animation:rise .32s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .view.on{animation:none}
  *{transition-duration:.01ms !important}
}

.head{display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem}
.head .eyebrow{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
h1{
  font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,3.4vw,2.35rem);
  letter-spacing:-.028em;line-height:1.1;text-wrap:balance;
}
h2{
  font-family:var(--display);font-weight:700;font-size:1.18rem;letter-spacing:-.014em;
  line-height:1.25;text-wrap:balance;
}
h3{font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:-.005em}
.lede{font-size:1.06rem;color:var(--ink-2);max-width:60ch}
.rule{height:1px;background:var(--line);border:0;margin:2.4rem 0}
.rule.beam{
  height:3px;background:none;
  border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
}

.stack{display:flex;flex-direction:column;gap:1.7rem}
.sec{display:flex;flex-direction:column;gap:.85rem}
.sec p{max-width:65ch}
.bul{display:flex;flex-direction:column;gap:.5rem;max-width:65ch}
.bul li{position:relative;padding-left:1.15rem}
.bul li::before{
  content:"";position:absolute;left:0;top:.72em;width:6px;height:1px;background:var(--accent);
}
.ol{counter-reset:s;display:flex;flex-direction:column;gap:.5rem;max-width:65ch}
.ol li{position:relative;padding-left:1.9rem;counter-increment:s}
.ol li::before{
  content:counter(s,decimal-leading-zero);position:absolute;left:0;top:.15em;
  font-family:var(--mono);font-size:.72rem;color:var(--accent-2);
}

/* cajas */
.box{
  border-left:2px solid var(--line-2);background:var(--surface);
  padding:.95rem 1.1rem;display:flex;flex-direction:column;gap:.4rem;max-width:65ch;
}
.box .lbl{font-size:.6rem}
.box p{font-size:.95rem;color:var(--ink-2)}
.box[data-k="obra"]{border-color:var(--accent);background:var(--accent-soft)}
.box[data-k="obra"] .lbl{color:var(--accent)}
.box[data-k="obra"] p{color:var(--ink)}
.box[data-k="alerta"]{border-color:var(--crit);background:var(--crit-soft)}
.box[data-k="alerta"] .lbl{color:var(--crit)}
.box[data-k="alerta"] p{color:var(--ink)}
.box[data-k="criterio"]{border-color:var(--warn);background:var(--warn-soft)}
.box[data-k="criterio"] .lbl{color:var(--warn)}
.box[data-k="criterio"] p{color:var(--ink)}

.claves{
  border:1px solid var(--line);background:var(--surface);padding:1.2rem 1.3rem;
  display:flex;flex-direction:column;gap:.7rem;
}

/* ── botones ──────────────────────────────────────────── */
.btn{
  font-family:var(--display);font-size:.82rem;font-weight:700;letter-spacing:.02em;
  background:var(--accent);color:var(--on-accent);padding:.55rem 1.05rem;border-radius:3px;
  transition:background .15s ease;
}
.btn:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:default;background:var(--accent)}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line-2)}
.btn.sec:hover{background:var(--surface-2)}
.btn.sm{font-size:.74rem;padding:.4rem .75rem}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.3rem}

/* ── quiz ─────────────────────────────────────────────── */
.quiz{display:flex;flex-direction:column;gap:1.4rem}
.q{display:flex;flex-direction:column;gap:.6rem}
.q > p{font-family:var(--display);font-size:.95rem;font-weight:700;line-height:1.4;max-width:62ch}
.opts{display:flex;flex-direction:column;gap:.4rem;max-width:64ch}
.opt{
  display:flex;gap:.65rem;align-items:flex-start;padding:.6rem .8rem;
  border:1px solid var(--line);border-radius:3px;background:var(--surface);
  font-size:.94rem;cursor:pointer;transition:border-color .15s ease;
}
.opt:hover{border-color:var(--line-2)}
.opt input{margin:.35rem 0 0;accent-color:var(--accent);flex:none}
.opt[data-r="ok"]{border-color:var(--good);background:var(--good-soft)}
.opt[data-r="mal"]{border-color:var(--crit);background:var(--crit-soft)}
.opt[data-r="era"]{border-color:var(--good);border-style:dashed}
.exp{
  font-size:.88rem;color:var(--ink-2);border-left:2px solid var(--line-2);
  padding-left:.8rem;max-width:62ch;
}
.exp b{color:var(--ink)}
.score{
  display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;
  border:1px solid var(--line);padding:.9rem 1.1rem;background:var(--surface);
}
.score .big{font-family:var(--mono);font-size:1.45rem;font-variant-numeric:tabular-nums}
.pill{
  font-family:var(--display);font-size:.66rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:.22rem .5rem;border-radius:2px;
}
.pill[data-v="ok"]{background:var(--good-soft);color:var(--good)}
.pill[data-v="warn"]{background:var(--warn-soft);color:var(--warn)}
.pill[data-v="crit"]{background:var(--crit-soft);color:var(--crit)}
.pill[data-v="neutro"]{background:var(--surface-2);color:var(--ink-3)}

/* ── panel ────────────────────────────────────────────── */
.grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 2rem}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.cell{background:var(--surface);padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.3rem}
.cell .v{font-family:var(--mono);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.cell .v small{font-size:.9rem;color:var(--ink-3)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.card{
  background:var(--surface);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.4rem;
  text-align:left;transition:background .15s ease;
}
.card:hover{background:var(--surface-2)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.card h3{line-height:1.3}
.card p{font-size:.88rem;color:var(--ink-2)}

/* ── simulador ────────────────────────────────────────── */
.caso{border:1px solid var(--line);background:var(--surface);padding:1.4rem;display:flex;
  flex-direction:column;gap:1rem}
.situ{font-size:1rem;max-width:64ch}
.opciones{display:flex;flex-direction:column;gap:.5rem;max-width:64ch}
.mov{
  text-align:left;border:1px solid var(--line);border-radius:3px;padding:.7rem .9rem;
  background:var(--paper);font-size:.94rem;line-height:1.45;transition:border-color .15s ease;
}
.mov:hover:not(:disabled){border-color:var(--accent)}
.mov:disabled{cursor:default;opacity:.5}
.mov[data-p="2"]{border-color:var(--good);background:var(--good-soft);opacity:1}
.mov[data-p="1"]{border-color:var(--warn);background:var(--warn-soft);opacity:1}
.mov[data-p="-1"]{border-color:var(--crit);background:var(--crit-soft);opacity:1}
.pasos{display:flex;gap:4px;align-items:center}
.paso{width:26px;height:4px;background:var(--sunk);border-radius:99px}
.paso[data-on="1"]{background:var(--accent)}

/* ── canvas / formularios ─────────────────────────────── */
.campo{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1.2rem}
.campo label{font-family:var(--display);font-size:.82rem;font-weight:700;line-height:1.35}
.campo .hint{font-size:.82rem;color:var(--ink-3);max-width:60ch}
.campo textarea,.campo input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:.6rem .7rem;font-family:var(--mono);font-size:.86rem;line-height:1.55;resize:vertical;
}
.campo textarea:focus,.campo input:focus{border-color:var(--accent);outline:none}

.escala{display:flex;flex-direction:column;gap:.9rem}
.item{border-bottom:1px solid var(--line);padding-bottom:.85rem;display:flex;
  flex-direction:column;gap:.5rem}
.item p{font-size:.95rem;max-width:60ch}
.radios{display:flex;gap:.35rem;flex-wrap:wrap}
.radios label{
  display:grid;place-items:center;width:2.1rem;height:2.1rem;border:1px solid var(--line);
  border-radius:3px;font-family:var(--mono);font-size:.8rem;cursor:pointer;background:var(--surface);
}
.radios label:hover{border-color:var(--line-2)}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--on-accent)}
.radios label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.radios label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

.barras{display:flex;flex-direction:column;gap:.55rem}
.barra{display:grid;grid-template-columns:11rem 1fr 2.2rem;gap:.7rem;align-items:center}
.barra .n{font-family:var(--display);font-size:.8rem;line-height:1.25}
.barra .t{height:9px;background:var(--sunk);border-radius:2px;overflow:hidden}
.barra .t i{display:block;height:100%;background:var(--accent);transition:width .6s ease}
.barra .t i[data-low="1"]{background:var(--crit)}
.barra .t i[data-mid="1"]{background:var(--warn)}
.barra .s{font-family:var(--mono);font-size:.78rem;text-align:right;color:var(--ink-2)}

/* ── glosario ─────────────────────────────────────────── */
.buscar{
  width:100%;max-width:24rem;background:var(--surface);border:1px solid var(--line);
  border-radius:3px;padding:.55rem .75rem;font-family:var(--display);font-size:.9rem;
}
.buscar:focus{border-color:var(--accent);outline:none}
.dl{display:flex;flex-direction:column}
.term{border-bottom:1px solid var(--line);padding:.9rem 0;display:flex;flex-direction:column;gap:.25rem}
.term dt{font-family:var(--display);font-weight:700;font-size:.95rem}
.term dd{font-size:.94rem;color:var(--ink-2);max-width:64ch}
.term dt em{font-style:normal;font-family:var(--mono);font-size:.75rem;color:var(--ink-3);margin-left:.4rem}

/* ── responsive ───────────────────────────────────────── */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:static;height:auto;flex-direction:column;align-items:stretch;overflow:visible;
    gap:.7rem;padding:.85rem .9rem;border-right:0;border-bottom:1px solid var(--line);
  }
  .brandtxt,.railgrp > .lbl{display:none}
  .brand{padding:0}
  .logo{width:11rem;max-width:none}
  .railscroll{flex-direction:row;align-items:center;gap:.4rem;overflow-x:auto;padding-bottom:.2rem}
  .railgrp{flex-direction:row;gap:.3rem;flex:none}
  .spine::before{display:none}
  .nav{padding:.4rem .7rem;border:1px solid var(--line);border-radius:3px;white-space:nowrap;width:auto}
  .nav[aria-current="true"]::before{display:none}
  .nav .t{display:none}
  .nav.wide .t{display:block}
  .railfoot{
    margin:0;padding:0;flex-direction:row;align-items:center;gap:.5rem;flex:none;
    position:static;border-top:0;background:none;
  }
  .railfoot .row,.railfoot .meter{display:none}
  .main{padding:1.8rem 1.2rem 5rem}
  .grid.c3{grid-template-columns:1fr}
  .barra{grid-template-columns:1fr;gap:.25rem}
  .barra .s{text-align:left}
}

/* ── impresión (canvas) ───────────────────────────────── */
.printhead{display:none}
@media print{
  @page{size:A4;margin:14mm}
  .rail,.acts,.no-print{display:none !important}
  .main{padding:0;max-width:100%;width:100%}
  body{background:#fff;color:#000;font-size:11pt}
  .campo textarea{border:1px solid #999;min-height:auto}
  .view{display:none !important}
  .view.on{display:block !important}
  .printhead{
    display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;
    border-bottom:1.5pt solid #000;padding-bottom:.5rem;margin-bottom:1.4rem;
  }
  .printhead img{width:46mm;height:auto;background:none;padding:0}
  .printhead .pt{font-family:var(--display);font-weight:700;font-size:11pt;text-align:right;line-height:1.3}
  .printhead .pt small{display:block;font-weight:400;font-size:8pt;letter-spacing:.08em;text-transform:uppercase}
}

/* ── captura para PDF descargable (misma lógica que impresión, vía clase) ── */
body.pdf-export .rail,body.pdf-export .acts,body.pdf-export .no-print{display:none !important}
body.pdf-export .main{padding:0;max-width:100%;width:100%}
body.pdf-export{background:#fff;color:#000}
body.pdf-export .campo textarea{border:1px solid #999;min-height:auto}
body.pdf-export .printhead{
  display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;
  border-bottom:1.5pt solid #000;padding-bottom:.5rem;margin-bottom:1.4rem;
}
body.pdf-export .printhead img{width:46mm;height:auto;background:none;padding:0}
body.pdf-export .printhead .pt{font-family:var(--display);font-weight:700;font-size:11pt;text-align:right;line-height:1.3}

/* Genera un PDF a partir del contenido visible de una vista y lo descarga directamente
   como archivo (sin pasar por el diálogo de impresión del navegador). Captura el contenido
   con html2canvas y arma el PDF cortando esa captura en páginas del tamaño de una hoja A4,
   agregando cada corte como imagen con jsPDF. Este método es más confiable que el method
   doc.html() de jsPDF, que no siempre interpreta bien flexbox ni variables CSS. Si algo
   falla (por ejemplo, sin conexión a internet y las librerías no llegaron a cargar), cae
   en el diálogo de impresión del navegador como alternativa. */
async function descargarPDF(selector, filename, boton){
  const el = document.querySelector(selector);
  const original = boton ? boton.textContent : null;
  if(!el || !window.jspdf || !window.html2canvas){ window.print(); return; }
  if(boton){ boton.disabled = true; boton.textContent = "Generando PDF…"; }
  document.body.classList.add("pdf-export");
  try{
    // deja que el navegador aplique el recálculo de estilos de .pdf-export antes de capturar
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const anchoCaptura = 800; // ancho fijo, en px CSS, al que se renderiza el contenido
    const canvas = await window.html2canvas(el, {
      scale: 2, backgroundColor: "#ffffff", useCORS: true,
      windowWidth: anchoCaptura, width: anchoCaptura,
      scrollX: 0, scrollY: 0
    });

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:"pt", format:"a4"});
    const margen = 28;
    const pagAncho = doc.internal.pageSize.getWidth() - margen*2;
    const pagAlto = doc.internal.pageSize.getHeight() - margen*2;
    // píxeles de canvas por cada punto del PDF, manteniendo el ancho del canvas
    // siempre igual al ancho disponible de la página (nunca más ancho que la hoja)
    const escala = canvas.width / pagAncho;
    const altoPorPagina = Math.floor(pagAlto * escala);

    let y = 0, pagina = 0;
    while(y < canvas.height){
      const alto = Math.min(altoPorPagina, canvas.height - y);
      const trozo = document.createElement("canvas");
      trozo.width = canvas.width;
      trozo.height = alto;
      trozo.getContext("2d").drawImage(canvas, 0, y, canvas.width, alto, 0, 0, canvas.width, alto);
      const imgData = trozo.toDataURL("image/jpeg", 0.92);
      const altoEnPdf = alto / escala;
      if(pagina > 0) doc.addPage();
      doc.addImage(imgData, "JPEG", margen, margen, pagAncho, altoEnPdf);
      y += alto;
      pagina++;
    }
    doc.save(filename);
  }catch(err){
    window.print();
  }finally{
    document.body.classList.remove("pdf-export");
    if(boton){ boton.disabled = false; boton.textContent = original; }
  }
}

  id:"c1",
  t:"El honorario cuestionado",
  ctx:"Un desarrollador privado lo convoca para el proyecto estructural de un edificio de vivienda de siete niveles. Usted presentó su propuesta hace una semana. En la reunión de hoy le dice que el valor le parece alto y que tiene otra propuesta por bastante menos.",
  pasos:[
    {s:"Apenas se sientan, antes de cualquier otra cosa, dice: «Mirá, te soy sincero: tengo otro estudio que me lo hace por casi la mitad. ¿Qué podés hacer?»",
     o:[{t:"«Puedo revisar el número y acercarme.»",p:-1,f:"Concedió antes de saber qué está comparando y sin obtener nada a cambio. La otra parte aprende que hay margen y va a volver a pedir. Además nunca averiguó si las propuestas son comparables."},
        {t:"«¿Qué incluye esa propuesta? Comparemos alcance por alcance y vemos si estamos hablando de lo mismo.»",p:2,f:"Correcto. Devuelve la conversación a un terreno verificable, obtiene información y suspende la discusión de precio hasta que ambos hablen de lo mismo. Es raro que dos propuestas de estructura tengan el mismo alcance."},
        {t:"«Ese valor no es serio para una obra de esta envergadura.»",p:-1,f:"Descalifica sin datos, roza la impugnación a un colega y no obtiene información alguna. Si el comitente contrata igual al otro, esta frase queda como antecedente incómodo."}]},
    {s:"Le muestra la otra propuesta. Cubre el cálculo estructural, pero no incluye planos de detalle de armaduras, ni asistencia técnica en obra, ni la documentación para la aprobación municipal.",
     o:[{t:"Señalar punto por punto lo que falta y cuantificar qué implica cada faltante en obra.",p:2,f:"Es la jugada central del caso. La diferencia de precio deja de ser un capricho y pasa a ser una diferencia de contenido, con consecuencias concretas: sin planos de detalle alguien va a improvisar armaduras en obra."},
        {t:"Ofrecer un valor intermedio para no perder el trabajo.",p:-1,f:"Concede sin usar la información que acaba de obtener. Está compitiendo contra una propuesta que ni siquiera es equivalente a la suya."},
        {t:"Decir que su propuesta es integral y que no es comparable, sin entrar en detalle.",p:1,f:"La afirmación es cierta pero no está demostrada. Sin el detalle ítem por ítem, el comitente escucha una defensa genérica y se queda con la diferencia de precio como único dato duro."}]},
    {s:"El comitente lo reconoce: «Entiendo, es más completo. Pero mi presupuesto es el que es. Necesito bajar el número igual.»",
     o:[{t:"Ofrecer tres alternativas de alcance a distinto precio y dejarlo elegir.",p:2,f:"Convierte la discusión de precio en una decisión de alcance. El comitente recupera control, usted no regala trabajo, y cada recorte queda explícitamente asociado a lo que deja de recibir."},
        {t:"Bajar un 10 % manteniendo todo el alcance.",p:-1,f:"Concesión unilateral: el alcance queda igual y el honorario baja. Además comunica que el precio original tenía aire, lo que invita a un pedido siguiente."},
        {t:"Mantener el precio y explicar de nuevo por qué está bien fundado.",p:1,f:"Firme y coherente, pero repetir el mismo argumento ante una restricción presupuestaria real no destraba nada. Faltó explorar las variables no monetarias."}]},
    {s:"Elige la alternativa intermedia: excluye las tramitaciones municipales, que hará su propio gestor. Antes de cerrar agrega: «Y el pago me gustaría hacerlo a noventa días de terminado todo.»",
     o:[{t:"Aceptar, ya se negoció bastante y el acuerdo está prácticamente cerrado.",p:-1,f:"Es la táctica del salame, y funcionó. El plazo de pago a noventa días del final, en un contexto inflacionario, puede consumir toda la diferencia que se defendió durante la reunión."},
        {t:"«Puedo trabajar con esa forma de pago si el valor se ajusta por índice hasta la fecha de cobro efectivo.»",p:2,f:"Correcto: la nueva condición se acepta con contraprestación y el riesgo queda neutralizado con un mecanismo objetivo en lugar de una discusión de monto."},
        {t:"«El pago es contra cada etapa, no es negociable.»",p:1,f:"Protege el flujo de caja pero desaprovecha la oportunidad. Ese pedido era una moneda de cambio que podría haber comprado algo — un anticipo mayor, una etapa futura comprometida."}]},
    {s:"Acuerdan las condiciones. El comitente se levanta y dice: «Perfecto, arrancá el lunes que voy armando el contrato.»",
     o:[{t:"Enviar ese mismo día el resumen escrito de lo acordado y comenzar cuando esté el contrato firmado.",p:2,f:"El resumen inmediato fija los términos mientras están frescos y quien lo redacta define el vocabulario. Empezar recién con el instrumento firmado protege el trabajo y no demora nada real."},
        {t:"Empezar el lunes y firmar el contrato cuando lo envíen.",p:-1,f:"Trabajo sin instrumento y sin anticipo. Entrega el poder de negociación justo después de haberlo defendido durante toda la reunión."},
        {t:"Pedir el contrato firmado antes de cualquier comunicación posterior.",p:1,f:"El resguardo es correcto pero pierde la oportunidad más valiosa: el resumen escrito del mismo día. Dejar pasar los días permite que los términos se desdibujen."}]}
  ],
  cierre:"Lo que decidió este caso no fue el precio sino el orden: primero información, después alcance, después número, y siempre concesión con contraprestación."
},
{
  id:"c2",
  t:"El adicional no reconocido",
  ctx:"Usted ejerce la dirección de obra de un centro logístico. La estructura está en ejecución. El comitente decide cambiar la disposición de un sector para incorporar un entrepiso técnico que no estaba en el proyecto.",
  pasos:[
    {s:"En la visita de obra del martes, el comitente le dice frente al capataz: «Necesito el entrepiso en ese sector. Ya lo hablé con el contratista, arranquen que después vemos los números.»",
     o:[{t:"Indicar en el momento que excede el alcance contratado y que lo va a formalizar por escrito ese día.",p:2,f:"Correcto, y el momento es clave: decirlo cuando ocurre, delante de todos, evita que después se discuta si el cambio era o no un adicional. El registro escrito del mismo día consolida la versión de los hechos."},
        {t:"Autorizar el inicio y anotarlo para el próximo certificado.",p:-1,f:"«Después vemos los números» es la frase que precede a los reclamos incobrables. Una vez ejecutado, el comitente no tiene ningún incentivo para acordar un precio que nunca aprobó."},
        {t:"Negarse a que se ejecute hasta tener una adenda firmada.",p:1,f:"El resguardo es entendible pero desproporcionado como primera respuesta: frena la obra por un trámite que puede resolverse en dos días y coloca la relación en un terreno innecesariamente rígido."}]},
    {s:"Esa tarde debe dejar constancia del pedido. ¿Qué registra?",
     o:[{t:"Una nota breve indicando que el comitente pidió el entrepiso.",p:1,f:"Registra el hecho, que es lo mínimo, pero omite lo que da fuerza al reclamo: la referencia al alcance original y la advertencia sobre incidencia en costo y plazo."},
        {t:"Orden de servicio con la descripción del cambio, la referencia al plano y al contrato que definen el alcance original, y la constancia de que se cuantificará la incidencia en costo y plazo.",p:2,f:"Completo. Un registro así no discute: demuestra. Fija qué se pidió, contra qué documento se compara y qué consecuencias tiene, todo con fecha."},
        {t:"Un correo informal al comitente comentando lo conversado.",p:1,f:"Mejor que nada y sirve como antecedente, pero en obra el instrumento propio del registro es la orden de servicio. Un correo suelto es más fácil de desconocer."}]},
    {s:"Cuantifica el adicional: un 6 % del monto de obra y catorce días de plazo. El comitente responde: «El monto lo discutimos, pero la fecha de entrega no se mueve, ya la comprometí con el operador logístico.»",
     o:[{t:"Aceptar sostener la fecha y ver cómo se resuelve sobre la marcha.",p:-1,f:"Asume un riesgo que no controla y que se materializa con certeza: catorce días de trabajo adicional no desaparecen porque se comprometió una fecha. Al final la mora será atribuida a la dirección de obra."},
        {t:"Explicar que el plazo original correspondía al alcance original, y ofrecer alternativas concretas para sostener la fecha: turnos adicionales, recursos extra o entrega parcial habilitando el sector operativo.",p:2,f:"Correcto: no discute la fecha en abstracto sino que expone el vínculo entre alcance y plazo, y ofrece opciones. Cada alternativa tiene un costo que el comitente puede evaluar."},
        {t:"Sostener que el plazo se amplía catorce días y que no hay alternativa.",p:1,f:"Técnicamente correcto y contractualmente defendible, pero deja al comitente sin salida frente a un compromiso propio. Ofrecer opciones onerosas rinde más que cerrar la puerta."}]},
    {s:"Acepta pagar el adicional pero propone: «Lo cerramos en un 4 % y listo, tampoco es tanta diferencia.»",
     o:[{t:"«Sobre el 6 % puedo revisar si ajustamos el alcance del entrepiso: la baranda perimetral y la terminación del piso pueden quedar fuera.»",p:2,f:"Mantiene la reciprocidad y pone al comitente frente a una elección real. El precio baja solamente si baja el contenido, que es la única concesión que no deja pérdida."},
        {t:"Aceptar el 4 % para no trabar la obra.",p:-1,f:"Concesión unilateral bajo presión de continuidad. Además sienta el precedente de que los adicionales de esta obra se cierran a la baja por insistencia."},
        {t:"Sostener el 6 % apoyándose en el cómputo y los precios de mercado a la fecha.",p:2,f:"También correcto: la cuantificación está fundada en criterios objetivos y verificables, y sostenerla es legítimo. Algo menos flexible que ofrecer alternativas de alcance, pero igualmente sólido."}]},
    {s:"Cierran el acuerdo verbalmente al pie de la obra.",
     o:[{t:"Emitir la orden de servicio con el adicional aprobado, monto, plazo y firma, y dejarla asentada.",p:2,f:"El acuerdo verbal en obra no sobrevive a un cambio de interlocutor ni a seis meses de distancia. Formalizarlo de inmediato es lo que lo vuelve exigible."},
        {t:"Avanzar con la ejecución y regularizar en el certificado del mes.",p:-1,f:"Repite exactamente el error inicial del caso: ejecutar primero y documentar después, con el mismo desenlace previsible."},
        {t:"Enviar un correo confirmando lo acordado.",p:1,f:"Registro válido y mejor que nada, pero el instrumento contractual propio de la obra es la orden de servicio firmada. El correo es respaldo, no sustituto."}]}
  ],
  cierre:"El adicional se gana o se pierde en las primeras cuarenta y ocho horas: quien notifica y cuantifica antes de ejecutar negocia desde el registro y no desde la memoria."
},
{
  id:"c3",
  t:"El plazo imposible",
  ctx:"Un organismo público lo convoca para el proyecto ejecutivo de un puente vehicular. El pliego fija un plazo de sesenta días corridos. Su estimación realista es de noventa y cinco, e incluye un estudio de suelos cuyos resultados no dependen de usted.",
  pasos:[
    {s:"En la reunión previa a la presentación, el funcionario a cargo dice que el plazo del pliego no es modificable porque está atado a una fecha de financiamiento.",
     o:[{t:"Presentar la oferta aceptando los sesenta días y resolverlo después.",p:-1,f:"Comprometer un plazo inviable es asumir una penalidad casi segura y comprometer la calidad del proyecto de una obra de arte vial. Además el incumplimiento posterior queda registrado como antecedente."},
        {t:"Preguntar de qué depende exactamente la fecha de financiamiento y qué hito debe estar cumplido para esa fecha.",p:2,f:"Excelente. La restricción declarada casi nunca coincide con la restricción real. Muchas veces lo que debe estar cumplido en esa fecha es un hito parcial, no la totalidad del proyecto ejecutivo."},
        {t:"Declinar la convocatoria por plazo inviable.",p:1,f:"Prudente y defendible, pero prematuro: todavía no exploró si la restricción es tan rígida como se enuncia ni qué margen existe dentro del propio pliego."}]},
    {s:"Resulta que a los sesenta días debe estar aprobado el proyecto para licitar la obra, pero los planos de detalle de fundación pueden entregarse después, junto con la documentación de licitación.",
     o:[{t:"Proponer una entrega por etapas: documentación licitatoria a los sesenta días y planos de detalle de fundación a los noventa.",p:2,f:"Esta es la solución del caso. Encontró la restricción real y la separó del resto: el organismo cumple su hito de financiamiento y usted trabaja con un plazo técnicamente viable."},
        {t:"Mantener los noventa y cinco días y fundamentarlo técnicamente.",p:1,f:"Honesto y bien fundado, pero deja sin resolver el problema del organismo, que tiene una restricción real. Una propuesta que no resuelve el problema del otro difícilmente se acepte."},
        {t:"Ofrecer sesenta días incorporando más personal al equipo.",p:-1,f:"El estudio de suelos tiene un tiempo propio que no se acorta con más personal. Es la promesa que se incumple, y la incumple usted."}]},
    {s:"El funcionario responde que la propuesta le sirve, pero que el pliego dice sesenta días y él no puede apartarse del pliego.",
     o:[{t:"Insistir en que la solución es razonable y que se acepte igual.",p:-1,f:"Desconoce cómo funciona un organismo: el agente no puede apartarse del pliego aunque esté de acuerdo, porque el riesgo de la observación posterior es personal y suyo."},
        {t:"Presentar por nota, con fundamento técnico y antecedentes de proyectos análogos, la solicitud de aclaratoria o modificación del cronograma de entregas dentro del procedimiento previsto.",p:2,f:"Correcto: le da al funcionario el instrumento formal que necesita para justificar la decisión. La palanca con un organismo no es la presión sino reducirle el riesgo a quien firma."},
        {t:"Buscar un contacto de mayor jerarquía dentro del organismo.",p:-1,f:"Saltear al interlocutor lo convierte en un opositor interno y no elimina la restricción formal, que seguirá existiendo con cualquier funcionario."}]},
    {s:"La modificación del cronograma se incorpora por circular aclaratoria. Al negociar el honorario, el organismo aplica un valor de referencia inferior al que usted calculó.",
     o:[{t:"Aceptar el valor del organismo, ya que consiguió el cronograma.",p:1,f:"El cronograma fue una conquista real, pero convertirla en motivo para aceptar cualquier honorario es reciprocidad mal aplicada: eran dos negociaciones distintas."},
        {t:"Fundamentar la diferencia con el cómputo de tareas efectivamente requeridas por el pliego y los honorarios de referencia aplicables, por nota.",p:2,f:"Correcto. Con un organismo el camino es siempre el mismo: criterio objetivo, por escrito, dentro del procedimiento. Un cómputo detallado suele revelar tareas exigidas por el pliego que el valor de referencia no contempló."},
        {t:"Retirarse de la convocatoria.",p:-1,f:"Prematuro: todavía no agotó la vía formal de fundamentación, que en este ámbito es la que efectivamente produce resultados."}]}
  ],
  cierre:"La restricción que la otra parte enuncia rara vez es la que realmente la limita. Preguntar de qué depende esa restricción es lo que abre las soluciones que el precio no abre."
},
{
  id:"c4",
  t:"El subcontratista clave",
  ctx:"Usted es representante técnico de la contratista. El hormigonado de la platea de fundación está previsto para dentro de doce días. La empresa de bombeo y provisión de hormigón, la única con capacidad en la zona, comunica un aumento del 18 % sobre lo cotizado.",
  pasos:[
    {s:"El proveedor sostiene que el aumento es por costo de materiales y que si no se acepta, reasigna los equipos a otra obra.",
     o:[{t:"Aceptar el aumento para no comprometer la fecha de hormigonado.",p:-1,f:"Cede ante una presión de tiempo sin verificarla y sin obtener nada. El proveedor aprende que el plazo de esta obra es una palanca eficaz y volverá a usarla."},
        {t:"Pedir el detalle de la variación por insumo y contrastarlo con los índices de costos publicados del período.",p:2,f:"Correcto: introduce un criterio objetivo y verificable. Si la variación real es del 9 %, el 18 % queda sin fundamento; y el pedido de detalle, por sí solo, suele moderar el aumento."},
        {t:"Advertir que se va a buscar otro proveedor.",p:-1,f:"Amenaza con un MAAN que no tiene. Si el proveedor sabe que es el único con capacidad en la zona, el farol se detecta de inmediato y debilita todo lo que venga después."}]},
    {s:"El detalle muestra una variación real del orden del 9 %. El proveedor sostiene igual el 18 % «por el riesgo de los próximos meses».",
     o:[{t:"Ofrecer el 9 % con ajuste automático por índice publicado para las entregas siguientes.",p:2,f:"Resuelve el interés real — la cobertura frente a la incertidumbre — sin pagar por adelantado un riesgo que puede no materializarse. El proveedor queda cubierto y la contratista paga el costo efectivo."},
        {t:"Partir la diferencia en el 13,5 %.",p:-1,f:"Reparto sin criterio, que además premia haber pedido de más. La próxima cotización volverá a venir inflada, porque la estrategia funcionó."},
        {t:"Sostener el precio original del contrato.",p:1,f:"Contractualmente defendible, pero ignora una variación de costos documentada del 9 % y arriesga la provisión a doce días del hormigonado por un principio."}]},
    {s:"El proveedor acepta el mecanismo de ajuste, pero pide pago anticipado del cincuenta por ciento contra entrega.",
     o:[{t:"Negarse, porque el contrato prevé pago a treinta días.",p:1,f:"Protege el flujo de caja, pero desaprovecha la moneda de cambio: en un proveedor con problemas financieros, el anticipo suele valer más que el precio."},
        {t:"Aceptar el anticipo a cambio de que quede fijado el precio de las entregas siguientes y garantizada la disponibilidad de equipos en las fechas comprometidas.",p:2,f:"Convierte una concesión financiera en cobertura de plazo y precio. Se identificó que el interés del proveedor es de caja y se compró con eso lo que la obra realmente necesita: certeza de provisión."},
        {t:"Aceptar el anticipo sin condiciones para asegurar el hormigonado.",p:-1,f:"Concesión unilateral en el peor momento: entrega dinero por adelantado y no obtiene ninguna garantía de disponibilidad, que era el riesgo verdadero."}]},
    {s:"Acordado todo, el proveedor menciona al pasar que los equipos de bombeo se facturan aparte, «como siempre».",
     o:[{t:"Verificarlo contra la cotización original y, si no estaba excluido, sostener que está incluido.",p:2,f:"El documento define el alcance, no la costumbre invocada. Verificar antes de discutir evita tanto la concesión innecesaria como el reclamo infundado."},
        {t:"Aceptar, es una práctica habitual del rubro.",p:-1,f:"Salame en el cierre. «Como siempre» es una afirmación sobre la costumbre, no sobre este contrato, y se resuelve leyendo la cotización."},
        {t:"Reabrir toda la negociación de precio.",p:1,f:"Reabrir el paquete es la respuesta correcta ante un pedido nuevo, pero antes corresponde verificar el documento: puede que no haya nada que reabrir."}]}
  ],
  cierre:"Frente a un proveedor sin sustituto, la palanca no es la amenaza sino el criterio objetivo y la identificación de su interés real, que casi nunca es solo el precio."
}
];

const GLOSARIO = [
 {t:"MAAN", a:"BATNA", d:"Mejor Alternativa a un Acuerdo Negociado: lo que efectivamente ocurriría si esta negociación no cerrara. Es la fuente real del poder de negociación y se mejora fuera de la mesa."},

const KEY = "neg-ic-v1";
const nuevo = () => ({mods:{}, casos:{}, canvas:{}, diag:{}});
let S = nuevo();

function cargar(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); S = Object.assign(nuevo(), p); }
  }catch(e){ S = nuevo(); }
}
function guardar(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function estadoMod(id){
  const m = S.mods[id];
  if(!m) return "x";
  if(m.quizOk) return "ok";
  if(m.leido) return "leido";
  return "x";
}

/* Avance: 8 módulos leídos + 8 quiz aprobados + 4 casos + canvas + diagnóstico = 22 unidades */
function avance(){
  let hecho = 0;
  const total = MODULOS.length*2 + CASOS.length + 2;
  MODULOS.forEach(m => { const e = S.mods[m.id]||{}; if(e.leido) hecho++; if(e.quizOk) hecho++; });
  CASOS.forEach(c => { if((S.casos[c.id]||{}).done) hecho++; });
  if(Object.values(S.canvas).filter(v => (v||"").trim().length > 2).length >= 6) hecho++;
  if(Object.keys(S.diag).length === COMPETENCIAS.length) hecho++;
  return {hecho, total, pct: Math.round(hecho/total*100)};
}

/* ════════════════════════════════════════════════════════
   NAVEGACIÓN
   ════════════════════════════════════════════════════════ */

let vistaActual = "panel";

function ir(destino){
  vistaActual = destino;
  const esMod = destino.startsWith("m");
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  document.getElementById(esMod ? "v-modulo" : "v-" + destino).classList.add("on");
  if(esMod) pintarModulo(destino);
  else if(destino === "panel") pintarPanel();
  else if(destino === "simulador") pintarSimulador();
  else if(destino === "canvas") pintarCanvas();
  else if(destino === "diagnostico") pintarDiagnostico();
  else if(destino === "glosario") pintarGlosario();
  else if(destino === "informe") pintarInforme();
  document.querySelectorAll(".nav").forEach(b =>
    b.setAttribute("aria-current", b.dataset.go === destino ? "true" : "false"));
  window.scrollTo({top:0, behavior:"instant"});
  pintarRiel();
}

function pintarRiel(){
  const cont = document.getElementById("railMods");
  cont.querySelectorAll(".nav").forEach(n => n.remove());

  const diagN = Object.keys(S.diag).length;
  const bDiag = document.createElement("button");
  bDiag.className = "nav";
  bDiag.dataset.go = "diagnostico";
  bDiag.setAttribute("aria-current", vistaActual === "diagnostico" ? "true" : "false");
  bDiag.innerHTML = '<span class="joint" data-s="'+(diagN === COMPETENCIAS.length ? "ok" : (diagN ? "leido" : "x"))+'"></span>'+
                '<span class="mn">00</span>'+
                '<span class="t">Diagnóstico personal</span>';
  bDiag.onclick = () => ir("diagnostico");
  cont.appendChild(bDiag);

  MODULOS.forEach(m => {
    const b = document.createElement("button");
    b.className = "nav";
    b.dataset.go = m.id;
    b.setAttribute("aria-current", vistaActual === m.id ? "true" : "false");
    b.innerHTML = '<span class="joint" data-s="'+estadoMod(m.id)+'"></span>'+
                  '<span class="mn">'+String(m.n).padStart(2,"0")+'</span>'+
                  '<span class="t">'+esc(m.t)+'</span>';
    b.onclick = () => ir(m.id);
    cont.appendChild(b);
  });
  const casosOk = CASOS.filter(c => (S.casos[c.id]||{}).done).length;
  document.getElementById("jSim").dataset.s = casosOk === CASOS.length ? "ok" : (casosOk ? "leido" : "x");
  const canvasN = Object.values(S.canvas).filter(v => (v||"").trim().length > 2).length;
  document.getElementById("jCan").dataset.s = canvasN >= 6 ? "ok" : (canvasN ? "leido" : "x");
  const a = avance();
  document.getElementById("pctBar").style.width = a.pct + "%";
  document.getElementById("pctTxt").textContent = a.pct + "%";
}

/* ════════════════════════════════════════════════════════
   PANEL
   ════════════════════════════════════════════════════════ */

function pintarPanel(){
  const a = avance();
  const quizOk = MODULOS.filter(m => (S.mods[m.id]||{}).quizOk).length;
  const casosOk = CASOS.filter(c => (S.casos[c.id]||{}).done).length;
  const diagN = Object.keys(S.diag).length;
  const diagHecho = diagN === COMPETENCIAS.length;
  const pend = MODULOS.find(m => estadoMod(m.id) !== "ok");

  let h = '<div class="head">'+
    '<div class="eyebrow"><span class="lbl">Programa de autoaprendizaje</span>'+
    '<span class="pill" data-v="'+(a.pct===100?"ok":a.pct?"warn":"neutro")+'">'+a.hecho+' de '+a.total+' unidades</span></div>'+
    '<h1>Negociación en el ejercicio de la Ingeniería Civil</h1>'+
    '<p class="lede">Un diagnóstico inicial de competencias, ocho módulos de contenido, cuatro casos de decisión y un canvas de preparación. '+
    'El avance se guarda en este navegador, sin cuentas ni servidores.</p></div>';

  h += '<div class="grid c3">'+
    cel("Módulos aprobados", quizOk, "de "+MODULOS.length)+
    cel("Casos resueltos", casosOk, "de "+CASOS.length)+
    cel("Avance total", a.pct+"%", "")+
    '</div>';

  h += '<hr class="rule beam">';

  h += '<div class="sec" style="margin-bottom:1.2rem"><span class="lbl">'+(!diagHecho?"Empezar por":(pend?"Continuar por":"Programa completo"))+'</span>';
  if(!diagHecho){
    h += '<h2>Módulo 00 — Diagnóstico personal</h2>'+
         '<p>Doce preguntas sobre la propia conducta en la mesa de negociación. El resultado señala qué módulos conviene priorizar según el propio perfil.</p>'+
         '<div class="acts"><button class="btn" data-go="diagnostico">Hacer el diagnóstico</button></div>';
  } else if(pend){
    h += '<h2>Módulo '+String(pend.n).padStart(2,"0")+' — '+esc(pend.t)+'</h2>'+
         '<p>'+esc(pend.res)+'</p>'+
         '<div class="acts"><button class="btn" data-go="'+pend.id+'">Abrir módulo</button></div>';
  } else {
    h += '<h2>Recorrió los ocho módulos</h2><p>Un buen uso siguiente es el canvas de preparación antes de cada negociación real, y la revisión posterior del módulo 08.</p>'+
         '<div class="acts"><button class="btn" data-go="canvas">Abrir el canvas</button></div>';
  }
  h += '</div>';

  h += '<span class="lbl" style="display:block;margin-bottom:.6rem">Módulos</span><div class="cards">';
  h += (() => {
    const p = diagHecho ? ["ok","Respondido"] : diagN ? ["warn","A mitad"] : ["neutro","Pendiente"];
    return '<button class="card" data-go="diagnostico">'+
      '<div class="top"><span class="mini">00 · 8 min</span>'+
      '<span class="pill" data-v="'+p[0]+'">'+p[1]+'</span></div>'+
      '<h3>Diagnóstico personal</h3><p>Autoevaluación de doce competencias de negociación, con recomendación de módulos según el resultado.</p></button>';
  })();
  MODULOS.forEach(m => {
    const e = estadoMod(m.id);
    const p = e==="ok" ? ["ok","Aprobado"] : e==="leido" ? ["warn","Leído"] : ["neutro","Pendiente"];
    h += '<button class="card" data-go="'+m.id+'">'+
      '<div class="top"><span class="mini">'+String(m.n).padStart(2,"0")+' · '+m.min+' min</span>'+
      '<span class="pill" data-v="'+p[0]+'">'+p[1]+'</span></div>'+
      '<h3>'+esc(m.t)+'</h3><p>'+esc(m.res)+'</p></button>';
  });
  h += '</div>';

  h += '<span class="lbl" style="display:block;margin:1.8rem 0 .6rem">Práctica</span><div class="cards">'+
    tarjeta("simulador","Simulador de casos", casosOk+" de "+CASOS.length+" resueltos", "Cuatro situaciones reales con decisiones sucesivas y devolución en cada movimiento.")+
    tarjeta("canvas","Canvas de preparación", "Trece campos", "La hoja que conviene completar antes de cada negociación importante. Imprimible.")+
    '</div>';

  document.getElementById("v-panel").innerHTML = h;
  cablearGo("v-panel");
}
function cel(l, v, sub){
  return '<div class="cell"><span class="lbl">'+l+'</span><span class="v">'+v+(sub?' <small>'+sub+'</small>':'')+'</span></div>';
}
function tarjeta(go, t, meta, d){
  return '<button class="card" data-go="'+go+'"><div class="top"><span class="mini">'+meta+'</span></div>'+
    '<h3>'+t+'</h3><p>'+d+'</p></button>';
}
function cablearGo(id){
  document.getElementById(id).querySelectorAll("[data-go]").forEach(b => b.onclick = () => ir(b.dataset.go));
}

function pintarModulo(id){
  const m = MODULOS.find(x => x.id === id);
  const e = S.mods[id] || {};
  let h = printheadHTML("Módulo "+String(m.n).padStart(2,"0")+" — "+m.t+" · Comprobación");

  h += '<div class="no-print">';
  h += '<div class="head">'+
    '<div class="eyebrow"><span class="lbl">Módulo '+String(m.n).padStart(2,"0")+'</span>'+
    '<span class="mini">'+m.min+' min de lectura</span></div>'+
    '<h1>'+esc(m.t)+'</h1><p class="lede">'+esc(m.res)+'</p></div>';

  h += '<div class="claves" style="margin-bottom:2rem"><span class="lbl">Al terminar este módulo</span><ul class="bul">'+
       m.obj.map(o => '<li>'+esc(o)+'</li>').join("")+'</ul></div>';

  h += '<div class="stack">';
  m.sec.forEach(s => {
    h += '<div class="sec"><h2>'+esc(s.h)+'</h2>';
    (s.p||[]).forEach(p => h += '<p>'+esc(p)+'</p>');
    if(s.l) h += '<ul class="bul">'+s.l.map(x => '<li>'+esc(x)+'</li>').join("")+'</ul>';
    if(s.ol) h += '<ol class="ol">'+s.ol.map(x => '<li>'+esc(x)+'</li>').join("")+'</ol>';
    if(s.box) h += '<div class="box" data-k="'+s.box.k+'"><span class="lbl">'+esc(s.box.tl)+'</span><p>'+esc(s.box.c)+'</p></div>';
    h += '</div>';
  });
  h += '</div>';

  h += '<hr class="rule beam"><div class="claves"><span class="lbl">Para retener</span><ul class="bul">'+
       m.claves.map(c => '<li>'+esc(c)+'</li>').join("")+'</ul></div>';
  h += '</div>';

  h += '<hr class="rule no-print"><div class="head" style="margin-bottom:1.2rem">'+
       '<span class="lbl">Comprobación</span><h2>'+m.quiz.length+' preguntas de aplicación</h2>'+
       '<p style="color:var(--ink-2);font-size:.95rem" class="no-print">Se aprueba con tres de cuatro. Cada respuesta tiene su fundamento, incluidas las incorrectas.</p></div>';

  h += '<div class="quiz" id="quiz">';
  m.quiz.forEach((q, i) => {
    h += '<div class="q" data-i="'+i+'"><p>'+(i+1)+'. '+esc(q.q)+'</p><div class="opts">';
    q.o.forEach((o, j) => {
      h += '<label class="opt" data-j="'+j+'"><input type="radio" name="q'+i+'" value="'+j+'">'+
           '<span>'+esc(o)+'</span></label>';
    });
    h += '</div><div class="exp" hidden></div></div>';
  });
  h += '</div>';

  h += '<div class="acts no-print" style="margin-top:1.6rem">'+
       '<button class="btn" id="btnCorregir">Corregir</button>'+
       '<button class="btn sec" id="btnRehacer" hidden>Rehacer</button></div>'+
       '<div id="resQuiz"></div>';

  const sig = MODULOS[MODULOS.indexOf(m)+1];
  h += '<hr class="rule no-print"><div class="acts no-print">'+
       (MODULOS.indexOf(m) > 0 ? '<button class="btn sec" data-go="'+MODULOS[MODULOS.indexOf(m)-1].id+'">← Módulo anterior</button>' : '')+
       (sig ? '<button class="btn sec" data-go="'+sig.id+'">Módulo siguiente →</button>'
            : '<button class="btn sec" data-go="simulador">Ir al simulador →</button>')+
       '</div>';

  const v = document.getElementById("v-modulo");
  v.innerHTML = h;
  cablearGo("v-modulo");

  if(!e.leido){ S.mods[id] = Object.assign({}, e, {leido:true}); guardar(); pintarRiel(); }

  document.getElementById("btnCorregir").onclick = () => corregirQuiz(m);
  document.getElementById("btnRehacer").onclick = () => pintarModulo(id);
  if(e.quizOk || typeof e.quizScore === "number") corregirQuiz(m, e.respuestas);
}

function corregirQuiz(m, previas){
  const cont = document.getElementById("quiz");
  const resp = [];
  let ok = 0;
  m.quiz.forEach((q, i) => {
    const qEl = cont.querySelector('.q[data-i="'+i+'"]');
    let sel = previas ? previas[i] : null;
    if(sel === null || sel === undefined){
      const r = qEl.querySelector('input:checked');
      sel = r ? Number(r.value) : -1;
    }
    resp.push(sel);
    if(sel === q.c) ok++;
    qEl.querySelectorAll(".opt").forEach(o => {
      const j = Number(o.dataset.j);
      const inp = o.querySelector("input");
      inp.disabled = true;
      if(j === sel) inp.checked = true;
      if(j === q.c && j === sel) o.dataset.r = "ok";
      else if(j === sel) o.dataset.r = "mal";
      else if(j === q.c) o.dataset.r = "era";
    });
    const ex = qEl.querySelector(".exp");
    ex.hidden = false;
    ex.innerHTML = '<b>'+(sel === q.c ? "Correcta." : "Incorrecta.")+'</b> '+esc(q.e);
  });

  const aprob = ok >= Math.ceil(m.quiz.length * 0.75);
  const e = S.mods[m.id] || {};
  S.mods[m.id] = Object.assign({}, e, {leido:true, quizScore:ok, quizOk: e.quizOk || aprob, respuestas:resp});
  guardar(); pintarRiel();

  document.getElementById("btnCorregir").hidden = true;
  document.getElementById("btnRehacer").hidden = false;
  const resQuiz = document.getElementById("resQuiz");
  resQuiz.innerHTML =
    '<span class="pill" data-v="'+(aprob?"ok":"crit")+'">'+ok+' / '+m.quiz.length+' — '+
    (aprob ? "aprobado" : "conviene repasar")+'</span>'+
    '<div class="acts no-print" style="margin-top:.8rem"><button class="btn sec" id="btnPdfQuiz">Descargar PDF</button></div>';
  const btnPdfQuiz = document.getElementById("btnPdfQuiz");
  btnPdfQuiz.onclick = () => descargarPDF("#v-modulo", "Comprobación módulo "+String(m.n).padStart(2,"0")+" — "+m.t+".pdf", btnPdfQuiz);
}

/* ════════════════════════════════════════════════════════
   SIMULADOR
   ════════════════════════════════════════════════════════ */

let casoActivo = null, pasoActivo = 0, puntos = 0;

function pintarSimulador(){
  if(casoActivo) return pintarCaso();
  let h = '<div class="head"><span class="lbl">Práctica</span><h1>Simulador de casos</h1>'+
    '<p class="lede">Cuatro situaciones de la práctica profesional. En cada movimiento se elige una respuesta y se recibe la devolución en el momento; '+
    'no hay forma de deshacer, igual que en la mesa.</p></div><div class="cards">';
  CASOS.forEach(c => {
    const r = S.casos[c.id] || {};
    const max = c.pasos.length * 2;
    const p = r.done ? (r.score >= max*0.75 ? ["ok", r.score+" / "+max] : ["warn", r.score+" / "+max]) : ["neutro", c.pasos.length+" decisiones"];
    h += '<button class="card" data-caso="'+c.id+'"><div class="top"><span class="mini">'+c.pasos.length+' movimientos</span>'+
      '<span class="pill" data-v="'+p[0]+'">'+p[1]+'</span></div><h3>'+esc(c.t)+'</h3><p>'+esc(c.ctx)+'</p></button>';
  });
  h += '</div>';
  const v = document.getElementById("v-simulador");
  v.innerHTML = h;
  v.querySelectorAll("[data-caso]").forEach(b => b.onclick = () => {
    casoActivo = CASOS.find(c => c.id === b.dataset.caso);
    pasoActivo = 0; puntos = 0; pintarCaso();
  });
}

function pintarCaso(){
  const c = casoActivo;
  const paso = c.pasos[pasoActivo];
  const max = c.pasos.length * 2;
  const terminado = pasoActivo >= c.pasos.length;
  let h = terminado ? printheadHTML("Simulador de casos — "+c.t) : "";
  h += '<div class="head"><div class="eyebrow no-print"><span class="lbl">Caso</span>'+
    '<div class="pasos">'+c.pasos.map((_,i) => '<span class="paso" data-on="'+(i<pasoActivo?1:0)+'"></span>').join("")+'</div>'+
    '<span class="mini">'+puntos+' / '+max+'</span></div>'+
    '<h1>'+esc(c.t)+'</h1><p class="lede">'+esc(c.ctx)+'</p></div>';

  if(!terminado){
    h += '<div class="caso"><span class="lbl">Movimiento '+(pasoActivo+1)+' de '+c.pasos.length+'</span>'+
      '<p class="situ">'+esc(paso.s)+'</p><div class="opciones" id="opciones">';
    paso.o.forEach((o, i) => h += '<button class="mov" data-i="'+i+'">'+esc(o.t)+'</button>');
    h += '</div><div id="fb"></div></div>';
  } else {
    const band = puntos >= max*0.85 ? ["ok","Desempeño sólido"] : puntos >= max*0.6 ? ["warn","Desempeño aceptable"] : ["crit","Conviene rehacerlo"];
    h += '<div class="caso"><span class="lbl">Resultado</span>'+
      '<div class="score"><span class="big">'+puntos+' / '+max+'</span>'+
      '<span class="pill" data-v="'+band[0]+'">'+band[1]+'</span></div>'+
      '<p class="situ">'+esc(c.cierre)+'</p>'+
      '<div class="acts no-print"><button class="btn" id="btnVolver">Volver a los casos</button>'+
      '<button class="btn sec" id="btnRehacerCaso">Rehacer este caso</button>'+
      '<button class="btn sec" id="btnPdfCaso">Descargar PDF</button></div></div>';
  }
  h += '<div class="acts no-print" style="margin-top:1.4rem"><button class="btn sec" id="btnSalir">Salir del caso</button></div>';

  const v = document.getElementById("v-simulador");
  v.innerHTML = h;

  if(pasoActivo < c.pasos.length){
    v.querySelectorAll(".mov").forEach(b => b.onclick = () => elegir(Number(b.dataset.i)));
  } else {
    const r = S.casos[c.id] || {};
    if(!r.done || puntos > r.score){ S.casos[c.id] = {done:true, score:puntos}; guardar(); pintarRiel(); }
    document.getElementById("btnVolver").onclick = () => { casoActivo = null; pintarSimulador(); };
    document.getElementById("btnRehacerCaso").onclick = () => { pasoActivo = 0; puntos = 0; pintarCaso(); };
    const btnPdfCaso = document.getElementById("btnPdfCaso");
    btnPdfCaso.onclick = () => descargarPDF("#v-simulador", "Caso — "+c.t+".pdf", btnPdfCaso);
  }
  document.getElementById("btnSalir").onclick = () => { casoActivo = null; pintarSimulador(); };
}

function elegir(i){
  const paso = casoActivo.pasos[pasoActivo];
  const op = paso.o[i];
  puntos += op.p;
  const cont = document.getElementById("opciones");
  cont.querySelectorAll(".mov").forEach((b, j) => {
    b.disabled = true;
    if(j === i) b.dataset.p = String(op.p);
  });
  const marca = op.p === 2 ? ["ok","Movimiento óptimo"] : op.p === 1 ? ["warn","Aceptable, mejorable"] : ["crit","Movimiento débil"];
  document.getElementById("fb").innerHTML =
    '<div class="box" data-k="'+(op.p===2?"obra":op.p===1?"criterio":"alerta")+'" style="margin-top:1rem">'+
    '<span class="lbl">'+marca[1]+' · '+(op.p>0?"+":"")+op.p+'</span><p>'+esc(op.f)+'</p></div>'+
    '<div class="acts"><button class="btn" id="btnSig">'+
    (pasoActivo === casoActivo.pasos.length-1 ? "Ver resultado" : "Continuar")+'</button></div>';
  document.getElementById("btnSig").onclick = () => { pasoActivo++; pintarCaso(); };
}

/* ════════════════════════════════════════════════════════
   CANVAS
   ════════════════════════════════════════════════════════ */

function pintarCanvas(){
  let h = printheadHTML("Canvas de preparación de negociación");
  h += '<div class="head no-print"><span class="lbl">Práctica</span><h1>Canvas de preparación</h1>'+
    '<p class="lede">La hoja a completar antes de cada negociación importante. Se guarda automáticamente en este navegador. '+
    'Para reutilizarla en otra negociación conviene descargarla en PDF primero, y después limpiar los campos.</p></div>';
  h += '<div id="formCanvas">';
  CANVAS_CAMPOS.forEach(c => {
    h += '<div class="campo"><label for="'+c.id+'">'+esc(c.l)+'</label>'+
      '<span class="hint">'+esc(c.h)+'</span>'+
      '<textarea id="'+c.id+'" rows="'+c.r+'" data-k="'+c.id+'"></textarea></div>';
  });
  h += '</div><div class="acts no-print">'+
    '<button class="btn" id="btnImprimir">Descargar PDF</button>'+
    '<button class="btn sec" id="btnLimpiar">Limpiar el canvas</button></div>';

  const v = document.getElementById("v-canvas");
  v.innerHTML = h;
  v.querySelectorAll("textarea").forEach(t => {
    t.value = S.canvas[t.dataset.k] || "";
    t.addEventListener("input", () => {
      S.canvas[t.dataset.k] = t.value;
      guardar(); pintarRiel();
    });
  });
  const btnImprimir = document.getElementById("btnImprimir");
  btnImprimir.onclick = () => descargarPDF("#v-canvas", "Canvas de preparación.pdf", btnImprimir);
  document.getElementById("btnLimpiar").onclick = () => {
    if(!confirm("Se van a borrar todos los campos del canvas. ¿Continuar?")) return;
    S.canvas = {}; guardar(); pintarCanvas(); pintarRiel();
  };
}

/* ════════════════════════════════════════════════════════
   DIAGNÓSTICO
   ════════════════════════════════════════════════════════ */

function pintarDiagnostico(){
  let h = printheadHTML("Diagnóstico personal");
  h += '<div class="head no-print"><span class="lbl">Módulo 00</span><h1>Diagnóstico personal</h1>'+
    '<p class="lede">Doce afirmaciones sobre la propia conducta en la mesa. Se puntúa de 1 — «casi nunca» — a 5 — «de manera sistemática». '+
    'El resultado recomienda por dónde empezar el programa y qué desarrollar primero. Conviene repetirlo después de tres o cuatro negociaciones reales.</p></div>';

  h += '<div class="escala no-print" id="escala">';
  COMPETENCIAS.forEach(c => {
    h += '<div class="item"><p><b>'+esc(c.n)+'.</b> '+esc(c.q)+'</p><div class="radios">';
    for(let i=1;i<=5;i++){
      h += '<label><input type="radio" name="'+c.id+'" value="'+i+'"'+(S.diag[c.id]===i?" checked":"")+'><span>'+i+'</span></label>';
    }
    h += '</div></div>';
  });
  h += '</div><div class="acts no-print" style="margin-top:1.4rem">'+
    '<button class="btn" id="btnDiag">Ver resultado</button>'+
    '<button class="btn sec" id="btnLimpDiag">Limpiar respuestas</button></div>'+
    '<div id="resDiag"></div>';

  const v = document.getElementById("v-diagnostico");
  v.innerHTML = h;
  v.querySelectorAll('input[type="radio"]').forEach(r => r.addEventListener("change", () => {
    S.diag[r.name] = Number(r.value); guardar(); pintarRiel();
  }));
  document.getElementById("btnDiag").onclick = resultadoDiag;
  document.getElementById("btnLimpDiag").onclick = () => { S.diag = {}; guardar(); pintarDiagnostico(); pintarRiel(); };
  if(Object.keys(S.diag).length === COMPETENCIAS.length) resultadoDiag();
}

/* Devuelve el markup del resultado del diagnóstico (puntaje, barras, qué desarrollar
   y módulos recomendados), o el aviso de respuestas faltantes. Lo reutilizan tanto
   la vista del diagnóstico como el informe completo. */
function diagBloqueHTML(opts){
  opts = opts || {};
  const faltan = COMPETENCIAS.filter(c => !S.diag[c.id]);
  if(faltan.length){
    return '<div class="box" data-k="alerta" style="margin-top:1rem"><span class="lbl">'+
      (opts.informe ? "Diagnóstico sin completar" : "Faltan respuestas")+'</span>'+
      '<p>Quedan '+faltan.length+' afirmaciones sin puntuar. El resultado necesita las doce.</p></div>';
  }
  const vals = COMPETENCIAS.map(c => ({c, v:S.diag[c.id]}));
  const prom = vals.reduce((a,x) => a+x.v, 0) / vals.length;
  const bajas = vals.slice().sort((a,b) => a.v - b.v).slice(0,3);
  const modsRec = [...new Set(bajas.flatMap(x => x.c.mods))];

  let h = '<div class="score" style="margin-bottom:1.4rem"><span class="big">'+prom.toFixed(1)+' / 5</span>'+
    '<span class="pill" data-v="'+(prom>=4?"ok":prom>=3?"warn":"crit")+'">'+
    (prom>=4?"Práctica consolidada":prom>=3?"Base formada, con huecos":"Conviene recorrer el programa completo")+'</span></div>';
  if(opts.btnPdf) h += '<div class="acts no-print" style="margin-bottom:.4rem"><button class="btn sec" id="btnPdfDiag">Descargar PDF</button></div>';

  h += '<div class="barras">';
  vals.forEach(x => {
    const pct = x.v/5*100;
    const attr = x.v <= 2 ? ' data-low="1"' : x.v === 3 ? ' data-mid="1"' : '';
    h += '<div class="barra"><span class="n">'+esc(x.c.n)+'</span>'+
      '<span class="t"><i style="width:'+pct+'%"'+attr+'></i></span>'+
      '<span class="s">'+x.v+'/5</span></div>';
  });
  h += '</div>';

  h += '<hr class="rule"><div class="claves"><span class="lbl">Qué desarrollar primero</span>'+
    '<p style="font-size:.95rem;color:var(--ink-2)">Las tres competencias con menor puntaje fueron '+
    esc(bajas.map(b => b.c.n.toLowerCase()).join(", "))+'. Un punto de partida concreto para cada una:</p>'+
    '<ul class="bul">';
  bajas.forEach(b => { h += '<li>'+esc(b.c.n)+': '+esc(b.c.consejo)+'</li>'; });
  h += '</ul></div>';

  h += '<hr class="rule"><div class="claves"><span class="lbl">Por dónde seguir en el programa</span>'+
    '<p style="font-size:.95rem;color:var(--ink-2)">Los módulos que trabajan directamente esas competencias:</p>'+
    '<div class="acts no-print">';
  modsRec.forEach(id => {
    const m = MODULOS.find(x => x.id === id);
    h += '<button class="btn sm" data-go="'+id+'">'+String(m.n).padStart(2,"0")+' · '+esc(m.t)+'</button>';
  });
  h += '</div></div>';

  return h;
}

function resultadoDiag(){
  const cont = document.getElementById("resDiag");
  const completo = Object.keys(S.diag).length === COMPETENCIAS.length;
  const bloque = diagBloqueHTML({btnPdf:true});
  cont.innerHTML = completo
    ? '<hr class="rule beam"><div class="head" style="margin-bottom:1.2rem">'+
      '<span class="lbl">Resultado</span><h2>Perfil de competencias</h2></div>'+bloque
    : bloque;
  cont.querySelectorAll("[data-go]").forEach(b => b.onclick = () => ir(b.dataset.go));
  const btn = document.getElementById("btnPdfDiag");
  if(btn) btn.onclick = () => descargarPDF("#v-diagnostico", "Diagnóstico personal.pdf", btn);
}

/* ════════════════════════════════════════════════════════
   INFORME COMPLETO
   ════════════════════════════════════════════════════════ */

/* Resultado de la comprobación de un módulo, reconstruido a partir de lo guardado
   (sin tocar el DOM del quiz, que no existe en esta vista). */
function quizBloqueHTML(m){
  const e = S.mods[m.id] || {};
  if(!e.respuestas) return '<p style="color:var(--ink-2);font-size:.95rem">Comprobación pendiente.</p>';
  const resp = e.respuestas;
  const ok = e.quizScore;
  const aprob = ok >= Math.ceil(m.quiz.length * 0.75);
  let h = '<div class="score" style="margin-bottom:1rem"><span class="pill" data-v="'+(aprob?"ok":"crit")+'">'+
    ok+' / '+m.quiz.length+' — '+(aprob ? "aprobado" : "conviene repasar")+'</span></div><div class="quiz">';
  m.quiz.forEach((q, i) => {
    const sel = resp[i];
    h += '<div class="q"><p>'+(i+1)+'. '+esc(q.q)+'</p><div class="opts">';
    q.o.forEach((o, j) => {
      const r = (j===q.c && j===sel) ? ' data-r="ok"' : (j===sel) ? ' data-r="mal"' : (j===q.c) ? ' data-r="era"' : '';
      h += '<label class="opt"'+r+'><input type="radio" disabled'+(j===sel?" checked":"")+'><span>'+esc(o)+'</span></label>';
    });
    h += '</div><div class="exp"><b>'+(sel===q.c?"Correcta.":"Incorrecta.")+'</b> '+esc(q.e)+'</div></div>';
  });
  h += '</div>';
  return h;
}

/* Resultado final de un caso del simulador (no se guarda el detalle de cada
   movimiento, solo el puntaje final). */
function casoBloqueHTML(c){
  const r = S.casos[c.id];
  if(!r || !r.done) return '<p style="color:var(--ink-2);font-size:.95rem">Caso no resuelto.</p>';
  const max = c.pasos.length * 2;
  const band = r.score >= max*0.85 ? ["ok","Desempeño sólido"] : r.score >= max*0.6 ? ["warn","Desempeño aceptable"] : ["crit","Conviene rehacerlo"];
  return '<div class="score" style="margin-bottom:.6rem"><span class="big">'+r.score+' / '+max+'</span>'+
    '<span class="pill" data-v="'+band[0]+'">'+band[1]+'</span></div>'+
    '<p style="color:var(--ink-2);font-size:.95rem">'+esc(c.cierre)+'</p>';
}

function canvasBloqueHTML(){
  const n = Object.values(S.canvas).filter(v => (v||"").trim().length > 2).length;
  if(!n) return '<p style="color:var(--ink-2);font-size:.95rem">Canvas sin completar.</p>';
  let h = '';
  CANVAS_CAMPOS.forEach(c => {
    h += '<div class="campo" style="margin-bottom:.9rem"><label>'+esc(c.l)+'</label>'+
      '<p style="white-space:pre-wrap;margin-top:.3rem">'+esc((S.canvas[c.id]||"").trim() || "—")+'</p></div>';
  });
  return h;
}

function pintarInforme(){
  let h = printheadHTML("Informe completo de resultados");
  h += '<div class="head no-print"><span class="lbl">Descargas</span><h1>Informe completo</h1>'+
    '<p class="lede">Reúne en un solo documento el diagnóstico, las ocho comprobaciones de módulo, '+
    'los cuatro casos del simulador y el canvas de preparación, tal como están guardados en este navegador. '+
    'Lo que todavía no se completó figura como pendiente.</p>'+
    '<div class="acts"><button class="btn" id="btnPdfInforme">Descargar PDF</button></div></div>';

  h += '<hr class="rule beam"><div class="head" style="margin-bottom:1rem">'+
    '<span class="lbl">00 · Diagnóstico</span><h2>Perfil de competencias</h2></div>';
  h += diagBloqueHTML({});

  MODULOS.forEach(m => {
    h += '<hr class="rule"><div class="head" style="margin-bottom:1rem">'+
      '<span class="lbl">'+String(m.n).padStart(2,"0")+' · Comprobación</span><h2>'+esc(m.t)+'</h2></div>';
    h += quizBloqueHTML(m);
  });

  h += '<hr class="rule beam"><div class="head" style="margin-bottom:1rem"><span class="lbl">Práctica</span><h2>Simulador de casos</h2></div>';
  CASOS.forEach(c => {
    h += '<div class="sec" style="margin-bottom:1.2rem"><h3>'+esc(c.t)+'</h3>'+casoBloqueHTML(c)+'</div>';
  });

  h += '<hr class="rule beam"><div class="head" style="margin-bottom:1rem"><span class="lbl">Práctica</span><h2>Canvas de preparación</h2></div>';
  h += canvasBloqueHTML();

  document.getElementById("v-informe").innerHTML = h;
  const btnPdfInforme = document.getElementById("btnPdfInforme");
  btnPdfInforme.onclick = () => descargarPDF("#v-informe", "Informe completo — Negociación en Ingeniería Civil.pdf", btnPdfInforme);
}

/* ════════════════════════════════════════════════════════
   GLOSARIO
   ════════════════════════════════════════════════════════ */

function pintarGlosario(){
  let h = '<div class="head"><span class="lbl">Referencia</span><h1>Glosario</h1>'+
    '<p class="lede">Los términos del programa, con el sentido preciso que tienen dentro de él.</p></div>'+
    '<input class="buscar" id="buscar" type="search" placeholder="Buscar término o definición" aria-label="Buscar en el glosario">'+
    '<dl class="dl" id="dl" style="margin-top:1.2rem"></dl>';
  const v = document.getElementById("v-glosario");
  v.innerHTML = h;

  const dl = document.getElementById("dl");
  const render = (f) => {
    const q = (f||"").toLowerCase().trim();
    const lista = GLOSARIO.filter(g => !q || (g.t+" "+g.a+" "+g.d).toLowerCase().includes(q));
    dl.innerHTML = lista.length
      ? lista.map(g => '<div class="term"><dt>'+esc(g.t)+(g.a?'<em>'+esc(g.a)+'</em>':'')+'</dt><dd>'+esc(g.d)+'</dd></div>').join("")
      : '<div class="term"><dd>Sin resultados para esa búsqueda.</dd></div>';
  };
  render("");
  document.getElementById("buscar").addEventListener("input", ev => render(ev.target.value));
}
